name: Share Docker Images Directory (Full JSON Debug)

on:
  workflow_dispatch:

jobs:
  create-shares:
    runs-on: ubuntu-latest
    steps:
      - name: 完整抓取并输出私密分享的全部 JSON 字段
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
        run: |
          if [ -z "$QUARK_COOKIE" ]; then
            echo "❌ 缺少 secrets.QUARK_COOKIE"
            exit 1
          fi

          CLEAN_COOKIE=$(echo "$QUARK_COOKIE" | sed -e 's/^Cookie:[[:space:]]*//i' | tr -d '\r\n')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)"
          
          call_quark_get() {
            curl -s -X GET "$1" \
              -b "$CLEAN_COOKIE" \
              -H "User-Agent: $UA" \
              -H "Referer: https://pan.quark.cn/" \
              -H "Origin: https://pan.quark.cn"
          }

          call_quark_post() {
            curl -s -X POST "$1" \
              -b "$CLEAN_COOKIE" \
              -H "User-Agent: $UA" \
              -H "Referer: https://pan.quark.cn/" \
              -H "Origin: https://pan.quark.cn" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "$2"
          }

          echo "🔍 检索 docker_images 根目录 FID..."
          ROOT_JSON=$(call_quark_get "https://drive-pc.quark.cn/1/clouddrive/file/sort?pr=ucpro&fr=pc&pdir_fid=0&_size=100")
          TARGET_FID=$(echo "$ROOT_JSON" | jq -r '.data.list[] | select(.file_name=="docker_images") | .fid' 2>/dev/null || echo "")

          if [ -z "$TARGET_FID" ]; then
            echo "❌ 未找到 docker_images 文件夹"
            exit 1
          fi
          echo "✅ 成功锁定 FID: $TARGET_FID"

          # --------------------------------------------------------------------------
          # 核心参数配置：
          # url_type: 1      -> 强制私密加密分享 (必带提取码)
          # expired_type: 3  -> 7天有效 (1=永久, 4=30天)
          # --------------------------------------------------------------------------
          PAYLOAD=$(jq -n --arg fid "$TARGET_FID" '{"fid_list":[$fid], "title":"docker_images", "url_type":1, "expired_type":3}')

          echo ""
          echo "==================== [步骤 1] 发起创建私密分享 ===================="
          STEP1_RES=$(call_quark_post "https://drive-pc.quark.cn/1/clouddrive/share?pr=ucpro&fr=pc" "$PAYLOAD")
          echo "$STEP1_RES" | jq . || echo "$STEP1_RES"

          TASK_ID=$(echo "$STEP1_RES" | jq -r '.data.task_id // empty' 2>/dev/null || echo "")
          SHARE_ID=$(echo "$STEP1_RES" | jq -r '.data.task_resp.data.share_id // .data.share_id // empty' 2>/dev/null || echo "")

          # 如果是大目录触发了异步队列，执行轮询
          if [ -n "$TASK_ID" ] && [ -z "$SHARE_ID" ]; then
            echo ""
            echo "==================== [步骤 2] 轮询异步任务进度 (task_id: $TASK_ID) ===================="
            for i in {1..10}; do
              sleep 2
              TASK_RES=$(call_quark_get "https://drive-pc.quark.cn/1/clouddrive/task?pr=ucpro&fr=pc&task_id=${TASK_ID}")
              STATUS_CODE=$(echo "$TASK_RES" | jq -r '.data.status // empty' 2>/dev/null || echo "")
              
              if [ "$STATUS_CODE" == "2" ]; then
                echo "✅ 任务已就绪，原始任务报文如下："
                echo "$TASK_RES" | jq . || echo "$TASK_RES"
                
                SHARE_ID=$(echo "$TASK_RES" | jq -r '.data.share_id // .data.save_as.share_id // .data.task_resp.data.share_id // empty' 2>/dev/null || echo "")
                break
              else
                echo "⏳ 正在等待任务完成... (当前状态: $STATUS_CODE)"
              fi
            done
          fi

          if [ -z "$SHARE_ID" ]; then
            echo "❌ 未能拿到 share_id，终止执行"
            exit 1
          fi

          echo ""
          echo "==================== [步骤 3] 提取密码与直链原始报文 (share_id: $SHARE_ID) ===================="
          URL_API="https://drive-pc.quark.cn/1/clouddrive/share/password?pr=ucpro&fr=pc"
          STEP3_RES=$(call_quark_post "$URL_API" "{\"share_id\":\"$SHARE_ID\"}")
          
          # 将包含密码和直链的完整 JSON 报文全部展开打印
          echo "$STEP3_RES" | jq . || echo "$STEP3_RES"

          echo ""
          echo "==================== [最终解析结果] ===================="
          SHARE_URL=$(echo "$STEP3_RES" | jq -r '.data.share_url // .data.url // empty' 2>/dev/null || echo "")
          PASSCODE=$(echo "$STEP3_RES" | jq -r '.data.passcode // .data.pwd // .data.first_file.passcode // empty' 2>/dev/null || echo "")

          echo "🔗 最终链接: ${SHARE_URL:-未抓取到}"
          echo "🔑 真实提取码: ${PASSCODE:-未抓取到}"
          echo "=========================================================="
