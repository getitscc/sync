name: Share Docker Images Directory (Exact Capture Match)

on:
  workflow_dispatch:

jobs:
  create-shares:
    runs-on: ubuntu-latest
    steps:
      - name: 批量生成多规格夸克分享链接 (全量参数像素级对齐)
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
        run: |
          if [ -z "$QUARK_COOKIE" ]; then
            echo "❌ 缺少 secrets.QUARK_COOKIE"
            exit 1
          fi

          CLEAN_COOKIE=$(echo "$QUARK_COOKIE" | sed -e 's/^Cookie:[[:space:]]*//i' | tr -d '\r\n')

          # 封装精准反向工程请求函数（与抓包 Headers 严格对齐）
          call_quark() {
            local method="$1"
            local url="$2"
            local data="$3"

            local cmd=(curl -s -X "$method" "$url"
              -b "$CLEAN_COOKIE"
              -H 'accept: application/json, text/plain, */*'
              -H 'accept-language: zh-CN,zh;q=0.9,en;q=0.8'
              -H 'origin: https://pan.quark.cn'
              -H 'priority: u=1, i'
              -H 'referer: https://pan.quark.cn/'
              -H 'sec-ch-ua: "Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
              -H 'sec-ch-ua-mobile: ?0'
              -H 'sec-ch-ua-platform: "Windows"'
              -H 'sec-fetch-dest: empty'
              -H 'sec-fetch-mode: cors'
              -H 'sec-fetch-site: same-site'
              -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36'
            )

            if [ -n "$data" ]; then
              cmd+=(-H 'content-type: application/json' -d "$data")
            fi

            "${cmd[@]}"
          }

          echo "🔍 检索 docker_images 根目录 FID..."
          ROOT_JSON=$(call_quark GET "https://drive-pc.quark.cn/1/clouddrive/file/sort?pr=ucpro&fr=pc&pdir_fid=0&_size=100")
          TARGET_FID=$(echo "$ROOT_JSON" | jq -r '.data.list[] | select(.file_name=="docker_images") | .fid' 2>/dev/null || echo "")

          if [ -z "$TARGET_FID" ]; then
            echo "❌ 未能获取到 docker_images 文件夹的 FID"
            exit 1
          fi
          echo "✅ 成功锁定 docker_images FID: $TARGET_FID"

          create_link() {
            local spec_name="$1"
            local url_type="$2"      # 2=加密分享, 1=公开分享
            local expired_type="$3"  # 1=永久, 3=7天, 4=30天
            local is_encrypt="$4"

            echo ""
            echo "--------------------------------------------------------"
            echo "🚀 正在创建【$spec_name】(url_type: $url_type, expired_type: $expired_type)..."

            local target_pwd=""
            local payload=""

            # 核心修正：当需要加密时，由客户端随机生成 4 位大小写字母+数字，作为 passcode 上报
            if [ "$is_encrypt" == "true" ]; then
              target_pwd=$(tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c 4)
              payload=$(jq -n \
                --arg fid "$TARGET_FID" \
                --arg pwd "$target_pwd" \
                --argjson ut "$url_type" \
                --argjson et "$expired_type" \
                '{
                  "fid_list": [$fid],
                  "title": "来自：分享",
                  "url_type": $ut,
                  "passcode": $pwd,
                  "expired_type": $et,
                  "support_error_code": ["41060"]
                }')
            else
              target_pwd="无"
              payload=$(jq -n \
                --arg fid "$TARGET_FID" \
                --argjson ut "$url_type" \
                --argjson et "$expired_type" \
                '{
                  "fid_list": [$fid],
                  "title": "来自：分享",
                  "url_type": $ut,
                  "expired_type": $et,
                  "support_error_code": ["41060"]
                }')
            fi

            # 步骤 1：发起创建分享请求
            local step1_res=$(call_quark POST "https://drive-pc.quark.cn/1/clouddrive/share?pr=ucpro&fr=pc&uc_param_str=" "$payload")
            local task_id=$(echo "$step1_res" | jq -r '.data.task_id // empty' 2>/dev/null || echo "")
            local share_id=$(echo "$step1_res" | jq -r '.data.task_resp.data.share_id // .data.share_id // empty' 2>/dev/null || echo "")

            # 步骤 2：针对文件夹大任务进行 task 队列轮询
            if [ -n "$task_id" ] && [ -z "$share_id" ]; then
              echo "⏳ 等待夸克后台任务队列完成 (task_id: $task_id)..."
              for i in {0..10}; do
                sleep 2
                local task_status=$(call_quark GET "https://drive-pc.quark.cn/1/clouddrive/task?pr=ucpro&fr=pc&uc_param_str=&task_id=${task_id}&retry_index=${i}")
                local status_code=$(echo "$task_status" | jq -r '.data.status // empty' 2>/dev/null || echo "")
                if [ "$status_code" == "2" ]; then
                  share_id=$(echo "$task_status" | jq -r '.data.share_id // .data.save_as.share_id // .data.task_resp.data.share_id // empty' 2>/dev/null || echo "")
                  break
                fi
              done
            fi

            local share_url=""
            local return_passcode="$target_pwd"

            # 步骤 3：调用 /share/password 接口换取真实直链
            if [ -n "$share_id" ]; then
              local step3_res=$(call_quark POST "https://drive-pc.quark.cn/1/clouddrive/share/password?pr=ucpro&fr=pc&uc_param_str=" "{\"share_id\":\"$share_id\"}")
              
              share_url=$(echo "$step3_res" | jq -r '.data.share_url // .data.url // empty' 2>/dev/null || echo "")
              local fetched_pwd=$(echo "$step3_res" | jq -r '.data.passcode // .data.pwd // empty' 2>/dev/null || echo "")
              
              if [ -n "$fetched_pwd" ]; then
                return_passcode="$fetched_pwd"
              fi

              if [ -z "$share_url" ]; then
                local pwd_id=$(echo "$step3_res" | jq -r '.data.pwd_id // empty' 2>/dev/null || echo "")
                if [ -n "$pwd_id" ]; then
                  share_url="https://pan.quark.cn/s/${pwd_id}"
                else
                  share_url="https://pan.quark.cn/s/${share_id}"
                fi
              fi
            fi

            if [ -n "$share_url" ]; then
              echo "✅ 【$spec_name】创建成功！"
              echo "🔗 分享直链: $share_url"
              echo "🔑 真实生效提取码: $return_passcode"
            else
              echo "❌ 【$spec_name】创建失败"
              echo "第 1 步响应: $step1_res"
            fi
          }

          # 1. 有密码 · 永久有效 (url_type: 2, expired_type: 1)
          create_link "有密码 · 永久有效" 2 1 true

          # 2. 无密码 · 7天有效 (url_type: 1, expired_type: 3)
          create_link "无密码 · 7天有效" 1 3 false

          # 3. 有密码 · 30天有效 (url_type: 2, expired_type: 4)
          create_link "有密码 · 30天有效" 2 4 true

          echo ""
          echo "========================================================"
          echo "🎉 全部多规格链接批处理完成！"
          echo "========================================================"
