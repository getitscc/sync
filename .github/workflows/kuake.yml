name: Share Docker Images Directory (Full JSON Debug)

on:
  workflow_dispatch:

jobs:
  create-shares:
    runs-on: ubuntu-latest
    steps:
      - name: 批量生成多规格夸克分享链接 (打印全量原始 JSON)
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
        run: |
          if [ -z "$QUARK_COOKIE" ]; then
            echo "❌ 缺少 secrets.QUARK_COOKIE"
            exit 1
          fi

          CLEAN_COOKIE=$(echo "$QUARK_COOKIE" | sed -e 's/^Cookie:[[:space:]]*//i' | tr -d '\r\n')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)"
          
          call_quark_get() {
            curl -s -X GET "$1" \
              -b "$CLEAN_COOKIE" \
              -H "User-Agent: $UA" \
              -H "Referer: https://pan.quark.cn/" \
              -H "Origin: https://pan.quark.cn"
          }

          call_quark_post() {
            curl -s -X POST "$1" \
              -b "$CLEAN_COOKIE" \
              -H "User-Agent: $UA" \
              -H "Referer: https://pan.quark.cn/" \
              -H "Origin: https://pan.quark.cn" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "$2"
          }

          echo "🔍 检索 docker_images 根目录 FID..."
          ROOT_JSON=$(call_quark_get "https://drive-pc.quark.cn/1/clouddrive/file/sort?pr=ucpro&fr=pc&pdir_fid=0&_size=100")
          TARGET_FID=$(echo "$ROOT_JSON" | jq -r '.data.list[] | select(.file_name=="docker_images") | .fid' 2>/dev/null || echo "")

          if [ -z "$TARGET_FID" ]; then
            echo "❌ 未能获取到 docker_images 文件夹的 FID"
            exit 1
          fi
          echo "✅ docker_images FID: $TARGET_FID"

          create_and_debug_link() {
            local spec_name="$1"
            local url_type="$2"
            local expired_type="$3"

            echo ""
            echo "========================================================"
            echo "🚀 [调试开始] 正在测试：【$spec_name】"
            echo "👉 请求参数: url_type=$url_type, expired_type=$expired_type"
            echo "========================================================"

            local payload=$(jq -n --arg fid "$TARGET_FID" --argjson ut "$url_type" --argjson et "$expired_type" \
              '{"fid_list":[$fid], "title":"docker_images", "url_type":$ut, "expired_type":$et}')

            echo "📦 [原始请求] 第 1 步 Payload:"
            echo "$payload" | jq .

            local step1_res=$(call_quark_post "https://drive-pc.quark.cn/1/clouddrive/share?pr=ucpro&fr=pc" "$payload")
            echo "📥 [原始返回] 第 1 步完整响应:"
            echo "$step1_res" | jq . 2>/dev/null || echo "$step1_res"

            local task_id=$(echo "$step1_res" | jq -r '.data.task_id // empty' 2>/dev/null || echo "")
            local share_id=$(echo "$step1_res" | jq -r '.data.task_resp.data.share_id // .data.share_id // empty' 2>/dev/null || echo "")

            # 轮询异步队列
            if [ -n "$task_id" ] && [ -z "$share_id" ]; then
              echo "⏳ 检测到异步队列 (task_id: $task_id)，开始轮询..."
              for i in {1..10}; do
                sleep 2
                local task_status=$(call_quark_get "https://drive-pc.quark.cn/1/clouddrive/task?pr=ucpro&fr=pc&task_id=${task_id}")
                echo "📋 [原始返回] 任务轮询第 ${i} 次响应:"
                echo "$task_status" | jq . 2>/dev/null || echo "$task_status"

                local status_code=$(echo "$task_status" | jq -r '.data.status // empty' 2>/dev/null || echo "")
                if [ "$status_code" == "2" ]; then
                  share_id=$(echo "$task_status" | jq -r '.data.share_id // .data.save_as.share_id // .data.task_resp.data.share_id // empty' 2>/dev/null || echo "")
                  break
                fi
              done
            fi

            echo "🎯 捕获到的 share_id: ${share_id:-未捕获到}"

            if [ -n "$share_id" ]; then
              echo "🔑 [第 2 步] 调用 /share/password 换取详情..."
              local step2_res=$(call_quark_post "https://drive-pc.quark.cn/1/clouddrive/share/password?pr=ucpro&fr=pc" "{\"share_id\":\"$share_id\"}")
              echo "📥 [原始返回] 第 2 步完整响应:"
              echo "$step2_res" | jq . 2>/dev/null || echo "$step2_res"

              echo "🔑 [补充探测] 调用 /share/detail 接口查看是否藏在详情中..."
              local detail_res=$(call_quark_get "https://drive-pc.quark.cn/1/clouddrive/share/detail?pr=ucpro&fr=pc&share_id=${share_id}")
              echo "📥 [原始返回] /share/detail 接口完整响应:"
              echo "$detail_res" | jq . 2>/dev/null || echo "$detail_res"
            fi
            echo "========================================================"
          }

          # 1. 有密码 · 永久有效 (url_type: 0, expired_type: 1)
          create_and_debug_link "有密码 · 永久有效" 0 1

          # 2. 无密码 · 7天有效 (url_type: 1, expired_type: 3)
          create_and_debug_link "无密码 · 7天有效" 1 3

          # 3. 有密码 · 30天有效 (url_type: 0, expired_type: 4)
          create_and_debug_link "有密码 · 30天有效" 0 4
