name: Share Docker Images Directory

on:
  workflow_dispatch: # 在 GitHub 网页手动点击触发

jobs:
  create-shares:
    runs-on: ubuntu-latest
    steps:
      - name: 批量生成多规格夸克分享链接
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
        run: |
          if [ -z "$QUARK_COOKIE" ]; then
            echo "❌ 缺少 secrets.QUARK_COOKIE"
            exit 1
          fi

          CLEAN_COOKIE=$(echo "$QUARK_COOKIE" | sed -e 's/^Cookie:[[:space:]]*//i' | tr -d '\r\n')
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)"
          
          call_quark_get() {
            curl -s -X GET "$1" \
              -b "$CLEAN_COOKIE" \
              -H "User-Agent: $UA" \
              -H "Referer: https://pan.quark.cn/" \
              -H "Origin: https://pan.quark.cn"
          }

          call_quark_post() {
            curl -s -X POST "$1" \
              -b "$CLEAN_COOKIE" \
              -H "User-Agent: $UA" \
              -H "Referer: https://pan.quark.cn/" \
              -H "Origin: https://pan.quark.cn" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "$2"
          }

          echo "🔍 正在检索网盘中的 docker_images 根目录 FID..."
          ROOT_JSON=$(call_quark_get "https://drive-pc.quark.cn/1/clouddrive/file/sort?pr=ucpro&fr=pc&pdir_fid=0&_size=100")
          TARGET_FID=$(echo "$ROOT_JSON" | jq -r '.data.list[] | select(.file_name=="docker_images") | .fid' 2>/dev/null || echo "")

          if [ -z "$TARGET_FID" ]; then
            echo "❌ 未能获取到 docker_images 文件夹的 FID，请确认网盘根目录下存在该文件夹"
            exit 1
          fi
          echo "✅ 成功锁定 docker_images FID: $TARGET_FID"

          # 定义通用创建函数
          create_link() {
            local spec_name="$1"
            local url_type="$2"
            local expired_type="$3"

            echo ""
            echo "--------------------------------------------------------"
            echo "🚀 正在创建【$spec_name】..."
            local payload=$(jq -n --arg fid "$TARGET_FID" --argjson ut "$url_type" --argjson et "$expired_type" \
              '{"fid_list":[$fid], "title":"docker_images", "url_type":$ut, "expired_type":$et}')

            local step1_res=$(call_quark_post "https://drive-pc.quark.cn/1/clouddrive/share?pr=ucpro&fr=pc" "$payload")
            local share_id=$(echo "$step1_res" | jq -r '.data.task_resp.data.share_id // .data.share_id // empty' 2>/dev/null || echo "")
            local share_url=$(echo "$step1_res" | jq -r '.data.task_resp.data.share_url // .data.share_url // empty' 2>/dev/null || echo "")
            local passcode="无"

            if [ -n "$share_id" ]; then
              local step2_res=$(call_quark_post "https://drive-pc.quark.cn/1/clouddrive/share/password?pr=ucpro&fr=pc" "{\"share_id\":\"$share_id\"}")
              local p2_url=$(echo "$step2_res" | jq -r '.data.share_url // .data.url // empty' 2>/dev/null || echo "")
              if [ -n "$p2_url" ]; then share_url="$p2_url"; fi

              local p2_pass=$(echo "$step2_res" | jq -r '.data.passcode // .data.pwd // empty' 2>/dev/null || echo "")
              if [ -n "$p2_pass" ]; then passcode="$p2_pass"; fi
            fi

            if [ -z "$share_url" ] && [ -n "$share_id" ]; then
              share_url="https://pan.quark.cn/s/${share_id}"
            fi

            if [ -n "$share_url" ]; then
              echo "✅ 【$spec_name】生成成功！"
              echo "🔗 分享直链: $share_url"
              echo "🔑 提取码:   $passcode"
            else
              echo "❌ 【$spec_name】生成失败: $step1_res"
            fi
          }

          # 1. 有密码永久 (url_type: 0, expired_type: 1)
          create_link "有密码 · 永久有效" 0 1

          # 2. 无密码7天 (url_type: 1, expired_type: 3)
          create_link "无密码 · 7天有效" 1 3

          # 3. 有密码30天 (url_type: 0, expired_type: 4)
          create_link "有密码 · 30天有效" 0 4

          echo ""
          echo "========================================================"
          echo "🎉 全部多规格链接批处理完成！"
          echo "========================================================"
