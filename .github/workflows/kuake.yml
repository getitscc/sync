name: Test Quark Upload And Share (Fixed Alist + Native Share)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 启动并配置 AList 临时容器
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
        run: |
          if [ -z "$QUARK_COOKIE" ]; then
            echo "❌ 缺少 secrets.QUARK_COOKIE"
            exit 1
          fi

          CLEAN_COOKIE=$(echo "$QUARK_COOKIE" | sed -e 's/^Cookie:[[:space:]]*//i' | tr -d '\r\n')
          echo "CLEAN_COOKIE=$CLEAN_COOKIE" >> $GITHUB_ENV

          # 启动 AList 容器
          docker run -d --name alist_worker -p 5244:5244 xhofe/alist:latest > /dev/null
          until curl -s http://127.0.0.1:5244/api/public/settings > /dev/null; do sleep 1; done

          # 设置管理员固定密码为 123456
          docker exec alist_worker ./alist admin set 123456 > /dev/null
          
          LOGIN_RES=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username": "admin", "password": "123456"}')
          
          ALIST_TOKEN=$(echo "$LOGIN_RES" | jq -r '.data.token // empty')
          if [ -z "$ALIST_TOKEN" ]; then
            echo "❌ 获取 AList Token 失败: $LOGIN_RES"
            exit 1
          fi
          echo "ALIST_TOKEN=$ALIST_TOKEN" >> $GITHUB_ENV
          echo "✅ AList 鉴权凭据就绪"

          # 使用 jq 内置的 tojson 语法安全序列化 addition 参数
          STORAGE_PAYLOAD=$(jq -n \
            --arg cookie "$CLEAN_COOKIE" \
            '{
              mount_path: "/quark",
              order: 0,
              remark: "temp_driver",
              driver: "Quark",
              addition: ({cookie: $cookie, root_folder_id: "0"} | tojson)
            }')

          MOUNT_RES=$(curl -s -X POST http://127.0.0.1:5244/api/admin/storage/create \
            -H "Authorization: $ALIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$STORAGE_PAYLOAD")

          echo "挂载驱动响应: $MOUNT_RES"

          # 验证挂载是否连通夸克
          sleep 3
          CHECK_MOUNT=$(curl -s -X POST http://127.0.0.1:5244/api/fs/list \
            -H "Authorization: $ALIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"path": "/quark"}')
          
          if echo "$CHECK_MOUNT" | grep -q '"code":200'; then
            echo "🎉 夸克网盘挂载成功！"
          else
            echo "❌ 挂载校验未通过，原始信息: $CHECK_MOUNT"
            exit 1
          fi

      - name: 2. 模拟上传测试镜像包
        run: |
          TEST_DIR="test_demo"
          TEST_FILE="test_image_$(date +%s)_amd64.tar"
          LOCAL_TAR="/tmp/${TEST_FILE}"

          # 生成 1MB 的测试归档文件
          dd if=/dev/zero of="$LOCAL_TAR" bs=1M count=1 2>/dev/null
          echo "TEST_DIR=$TEST_DIR" >> $GITHUB_ENV
          echo "TEST_FILE=$TEST_FILE" >> $GITHUB_ENV

          echo "📁 创建目标文件夹: /quark/docker_images/${TEST_DIR}..."
          curl -s -X POST http://127.0.0.1:5244/api/fs/mkdir \
            -H "Authorization: $ALIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"path\": \"/quark/docker_images/${TEST_DIR}\"}" > /dev/null

          echo "📤 开始流式直传测试文件 (带完整 Admin 鉴权)..."
          UPLOAD_RES=$(curl -s -X PUT \
            -H "Authorization: $ALIST_TOKEN" \
            -H "File-Path: /quark/docker_images/${TEST_DIR}/${TEST_FILE}" \
            -H "As-Task: false" \
            -T "$LOCAL_TAR" \
            "http://127.0.0.1:5244/api/fs/put")

          echo "上传返回结果: $UPLOAD_RES"
          rm -f "$LOCAL_TAR"

          if ! echo "$UPLOAD_RES" | grep -q '"code":200'; then
            echo "❌ 上传失败，终止流程"
            exit 1
          fi
          echo "✅ 测试文件成功落盘至夸克网盘！"

      - name: 3. 穿透夸克官方 API 生成真实可用的公开直链
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)"
          
          call_quark_get() {
            curl -s -X GET "$1" \
              -b "$CLEAN_COOKIE" \
              -H "User-Agent: $UA" \
              -H "Referer: https://pan.quark.cn/" \
              -H "Origin: https://pan.quark.cn"
          }

          call_quark_post() {
            curl -s -X POST "$1" \
              -b "$CLEAN_COOKIE" \
              -H "User-Agent: $UA" \
              -H "Referer: https://pan.quark.cn/" \
              -H "Origin: https://pan.quark.cn" \
              -H "Content-Type: application/json;charset=UTF-8" \
              -d "$2"
          }

          echo "🔍 1. 查找根目录 docker_images FID..."
          ROOT_JSON=$(call_quark_get "https://drive-pc.quark.cn/1/clouddrive/file/sort?pr=ucpro&fr=pc&pdir_fid=0&_size=100")
          ROOT_FID=$(echo "$ROOT_JSON" | jq -r '.data.list[] | select(.file_name=="docker_images") | .fid' 2>/dev/null || echo "")

          echo "🔍 2. 查找分类子目录 ${TEST_DIR} FID..."
          CAT_JSON=$(call_quark_get "https://drive-pc.quark.cn/1/clouddrive/file/sort?pr=ucpro&fr=pc&pdir_fid=${ROOT_FID}&_size=100")
          CAT_FID=$(echo "$CAT_JSON" | jq -r --arg dir "$TEST_DIR" '.data.list[] | select(.file_name==$dir) | .fid' 2>/dev/null || echo "")

          echo "🔍 3. 查找测试文件 ${TEST_FILE} FID..."
          FILE_JSON=$(call_quark_get "https://drive-pc.quark.cn/1/clouddrive/file/sort?pr=ucpro&fr=pc&pdir_fid=${CAT_FID}&_size=100")
          TARGET_FID=$(echo "$FILE_JSON" | jq -r --arg fn "$TEST_FILE" '.data.list[] | select(.file_name==$fn) | .fid' 2>/dev/null || echo "")

          if [ -z "$TARGET_FID" ]; then
            echo "❌ 未能获取到落盘文件的 FID"
            exit 1
          fi
          echo "✅ 成功锁定文件实体 FID: $TARGET_FID"

          echo "==================== 请求创建公开免密直达链接 ===================="
          # 核心修复点：url_type=1 (真正的公开无密直达链接), expired_type=3 (7天有效)
          SHARE_PAYLOAD=$(jq -n --arg fid "$TARGET_FID" --arg title "$TEST_FILE" '{"fid_list":[$fid],"title":$title,"url_type":1,"expired_type":3}')
          
          STEP1_RES=$(call_quark_post "https://drive-pc.quark.cn/1/clouddrive/share?pr=ucpro&fr=pc" "$SHARE_PAYLOAD")
          echo "创建公开分享响应: $STEP1_RES"

          # 提取真正的公开分享直链
          SHARE_URL=$(echo "$STEP1_RES" | jq -r '.data.task_resp.data.share_url // .data.share_url // empty' 2>/dev/null || echo "")
          
          # 如果第一步未直接暴露 share_url，从 share_id 拼接真实的外链地址
          if [ -z "$SHARE_URL" ]; then
            SHARE_ID=$(echo "$STEP1_RES" | jq -r '.data.task_resp.data.share_id // .data.share_id // empty' 2>/dev/null || echo "")
            if [ -n "$SHARE_ID" ]; then
              SHARE_URL="https://pan.quark.cn/s/${SHARE_ID}"
            fi
          fi

          echo "=========================================================="
          if [ -n "$SHARE_URL" ]; then
            echo "🎉 真正的公开免密分享链接已生成！"
            echo "🔗 访问链接: $SHARE_URL"
            echo "💡 说明: 公开直达，无需提取码，可在任意浏览器直接下载"
          else
            echo "❌ 未能提取到合法外链"
            exit 1
          fi
          echo "=========================================================="
