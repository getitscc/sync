name: Docker Sync

# =====================================================
# 数据面：拉取 → 打包 → 上传 R2 → 回传直链
#
# 网盘归档功能已下线，本工作流只负责 R2。
#
# 需要 Secrets：
#   R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
#   R2_BUCKET（可选，默认 docker）
#   对象键：<registry别名>/<镜像名>/<文件>。
#   网盘路径：<挂载>/images/<registry别名>/<镜像名>/<文件>（顶层统一 images）。
#   例：R2 键 docker/redis/redis_6_linux-amd64.tar.gz → 网盘 /images/docker/redis/redis_6_linux-amd64.tar.gz
#   CALLBACK_SECRET       与 Worker 的 WEBHOOK_SECRET 一致
# =====================================================

on:
  repository_dispatch:
    types: [shiji_docker]
  workflow_dispatch:
    inputs:
      source_name:
        description: '镜像名（可带 registry，如 ghcr.io/owner/repo）'
        required: false
        default: 'nginx'
      version:
        description: '版本 / tag（留空默认 latest）'
        required: false
        default: ''
      arch:
        description: '架构（linux/amd64、linux/arm/v7 或裸 amd64）'
        required: false
        default: 'linux/amd64'
      r2_enabled:
        description: '是否上传 R2（true/false）'
        required: false
        default: 'true'
      pan_file_name:
        description: '可选：覆盖镜像文件名（默认 {image}_{version}_linux-{arch}.tar.gz）'
        required: false
        default: ''
      task_id:
        description: '任务 ID'
        required: false
        default: ''
      callback_url:
        description: '后端回调地址'
        required: false
        default: ''

# 每个任务独立并发组，允许多个任务同时跑（前端最多 2 个）
concurrency:
  group: docker-transfer-${{ github.event.client_payload.task_id || github.event.inputs.task_id || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # ============================================================
      # 步骤 1：参数解析
      # ============================================================
      - name: 1. 参数解析与镜像引用拼装
        id: params
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CALLBACK_BASE_URL: ${{ secrets.CALLBACK_BASE_URL }}
          IN_SOURCE: ${{ github.event.client_payload.source_name || github.event.inputs.source_name }}
          IN_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
          IN_ARCH: ${{ github.event.client_payload.arch || github.event.inputs.arch || 'linux/amd64' }}
          IN_R2_ENABLED: ${{ github.event.client_payload.r2_enabled || github.event.inputs.r2_enabled || 'true' }}
          IN_PAN_FILE_NAME: ${{ github.event.client_payload.pan_file_name || github.event.inputs.pan_file_name }}
          IN_TASK: ${{ github.event.client_payload.task_id || github.event.inputs.task_id }}
          IN_CALLBACK: ${{ github.event.client_payload.callback_url || github.event.inputs.callback_url }}
        run: |
          set -euo pipefail

          SOURCE="$IN_SOURCE"; VERSION="$IN_VERSION"; ARCH="$IN_ARCH"
          [ -n "$SOURCE" ] || { echo "::error::缺少 source_name"; exit 1; }
          VERSION=$(printf '%s' "$VERSION" | tr -d '\r' | xargs || true)
          SOURCE=$(printf '%s' "$SOURCE" | tr -d '\r' | xargs)
          SOURCE=$(printf '%s' "$SOURCE" | tr -s '/')
          SOURCE="${SOURCE#/}"; SOURCE="${SOURCE%/}"

          if [ -z "$VERSION" ] && [[ "$SOURCE" == *:* ]]; then
            VERSION="${SOURCE##*:}"; SOURCE="${SOURCE%%:*}"
          fi
          [ -n "$VERSION" ] || VERSION="latest"

          if [[ "$SOURCE" == *"/"* ]] && [[ "${SOURCE%%/*}" == *.* ]]; then
            FULL_REPO="$SOURCE"
          elif [[ "$SOURCE" == *"/"* ]]; then
            FULL_REPO="docker.io/$SOURCE"
          else
            FULL_REPO="docker.io/library/$SOURCE"
          fi
          FULL_IMAGE="${FULL_REPO}:${VERSION}"
          case "/$FULL_REPO/" in
            *"//"*) echo "::error::镜像名含空路径段（多余斜杠）: $FULL_REPO"; exit 1 ;;
          esac
          [[ "$FULL_REPO" =~ ^[a-z0-9._/-]+$ ]] || { echo "::error::镜像名含非法字符: $FULL_REPO"; exit 1; }

          if [[ "$ARCH" == *"/"* ]]; then ARCH_OS="${ARCH%%/*}"; ARCH_REST="${ARCH#*/}"; else ARCH_OS="linux"; ARCH_REST="$ARCH"; fi
          ARCH_NAME="${ARCH_REST%%/*}"; ARCH_VARIANT=""
          [[ "$ARCH_REST" == */* ]] && ARCH_VARIANT="${ARCH_REST#*/}"

          # registry → 镜像目录名
          REGISTRY="docker.io"; REPO_PATH="$FULL_REPO"
          if [[ "$FULL_REPO" == */* ]]; then
            FIRST="${FULL_REPO%%/*}"
            if [[ "$FIRST" == *.* ]]; then REGISTRY="$FIRST"; REPO_PATH="${FULL_REPO#*/}"; fi
          fi
          case "$REGISTRY" in
            docker.io)                REGISTRY_ALIAS="docker";     REGISTRY_LABEL="Docker Hub" ;;
            ghcr.io)                  REGISTRY_ALIAS="ghcr";       REGISTRY_LABEL="GHCR" ;;
            registry.k8s.io)          REGISTRY_ALIAS="k8s";        REGISTRY_LABEL="K8s" ;;
            nvcr.io)                  REGISTRY_ALIAS="nvidia";     REGISTRY_LABEL="NVIDIA" ;;
            gcr.io)                   REGISTRY_ALIAS="google";     REGISTRY_LABEL="Google" ;;
            quay.io)                  REGISTRY_ALIAS="quay";       REGISTRY_LABEL="Quay" ;;
            mcr.microsoft.com)         REGISTRY_ALIAS="microsoft";  REGISTRY_LABEL="Microsoft" ;;
            docker.elastic.co)        REGISTRY_ALIAS="elastic";    REGISTRY_LABEL="Elastic" ;;
            docker.n8n.io)            REGISTRY_ALIAS="n8n";        REGISTRY_LABEL="n8n" ;;
            skywalking.docker.scarf.sh) REGISTRY_ALIAS="skywalking"; REGISTRY_LABEL="SkyWalking" ;;
            *)                        REGISTRY_ALIAS="${REGISTRY//./-}"; REGISTRY_LABEL="$REGISTRY" ;;
          esac
          if [[ "$REGISTRY" == "docker.io" && "$REPO_PATH" == library/* ]]; then
            IMAGE_DIR="${REPO_PATH#library/}"
          else
            IMAGE_DIR="${REPO_PATH//\//-}"
            NS="${REPO_PATH%%/*}"; NAME="${REPO_PATH##*/}"
            # elasticsearch/elasticsearch 这类同名仓库不重复拼 namespace
            if [[ "$REPO_PATH" == */* && "$NS" == "$NAME" ]]; then IMAGE_DIR="$NAME"; fi
          fi
          IMAGE_DIR="${IMAGE_DIR// /-}"

          PAN_FILE_NAME="${IN_PAN_FILE_NAME:-${IMAGE_DIR}_${VERSION}_${ARCH_OS}-${ARCH_NAME}${ARCH_VARIANT:+-${ARCH_VARIANT}}.tar.gz}"
          TAR_NAME="${PAN_FILE_NAME%.gz}"
          CATEGORY_DIR="${IMAGE_DIR}"

          R2_ENABLED="$(printf '%s' "${IN_R2_ENABLED:-true}" | tr -d '\r' | xargs || true)"
          [ "$R2_ENABLED" = "true" ] || R2_ENABLED="false"
          DO_R2="true"
          [ "$R2_ENABLED" = "true" ] || DO_R2="false"

          TASK_ID="${IN_TASK:-manual_$(date +%s)}"
          CALLBACK_URL="$IN_CALLBACK"
          if [ -n "${CALLBACK_BASE_URL:-}" ]; then
            CALLBACK_URL="${CALLBACK_BASE_URL%/}/api/callback/gh"
          fi

          {
            echo "SOURCE=$SOURCE"
            echo "VERSION=$VERSION"
            echo "ARCH=$ARCH"
            echo "FULL_IMAGE=$FULL_IMAGE"
            echo "ARCH_OS=$ARCH_OS"
            echo "ARCH_NAME=$ARCH_NAME"
            echo "ARCH_VARIANT=$ARCH_VARIANT"
            echo "CATEGORY_DIR=$CATEGORY_DIR"
            echo "REGISTRY=$REGISTRY"
            echo "REGISTRY_ALIAS=$REGISTRY_ALIAS"
            echo "REGISTRY_LABEL=$REGISTRY_LABEL"
            echo "IMAGE_DIR=$IMAGE_DIR"
            echo "TAR_NAME=$TAR_NAME"
            echo "PAN_FILE_NAME=$PAN_FILE_NAME"
            echo "R2_ENABLED=$R2_ENABLED"
            echo "DO_R2=$DO_R2"
            echo "TASK_ID=$TASK_ID"
            echo "CALLBACK_URL=$CALLBACK_URL"
          } >> "$GITHUB_ENV"

          {
            echo "do_r2=$DO_R2"
          } >> "$GITHUB_OUTPUT"

          echo "📋 $FULL_IMAGE | $ARCH | R2 only"

          if [ -n "$CALLBACK_URL" ]; then
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "$(jq -n --arg t "$TASK_ID" '{taskId:$t,stage:"prepared",stage_msg:"参数解析完成，准备拉取"}')" || echo "000")
            echo "回调 prepared: HTTP $CODE"
            [ "$CODE" = "200" ] || echo "::warning::阶段回调失败（HTTP $CODE）"
          fi

      # ============================================================
      # 步骤 2~4：拉取与打包
      # ============================================================
      - name: 2. 安装工具链
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo curl jq pigz rclone

      - name: 3. 磁盘按需清理与工作目录准备
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$FULL_IMAGE" == ghcr.io/* ]] && [ -n "${GHCR_TOKEN:-}" ]; then
            echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi
          if [[ "$FULL_IMAGE" == nvcr.io/* ]] && [ -n "${NGC_API_KEY:-}" ]; then
            echo "$NGC_API_KEY" | skopeo login nvcr.io -u '$oauthtoken' --password-stdin
          fi
          # docker.n8n.io / skywalking.docker.scarf.sh 复用 Docker Hub 鉴权，
          # 不登录会按匿名用户计入 Docker Hub 拉取限额。
          if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            DOCKERHUB_HOST=""
            case "$FULL_IMAGE" in
              docker.io/*) DOCKERHUB_HOST="docker.io" ;;
              docker.n8n.io/*) DOCKERHUB_HOST="docker.n8n.io" ;;
              skywalking.docker.scarf.sh/*) DOCKERHUB_HOST="skywalking.docker.scarf.sh" ;;
            esac
            if [ -n "$DOCKERHUB_HOST" ]; then
              echo "$DOCKERHUB_TOKEN" | skopeo login "$DOCKERHUB_HOST" -u "$DOCKERHUB_USERNAME" --password-stdin
            fi
          fi

          PLATFORM=(--override-os "$ARCH_OS" --override-arch "$ARCH_NAME")
          [ -n "$ARCH_VARIANT" ] && PLATFORM+=(--override-variant "$ARCH_VARIANT")

          INFO=$(skopeo inspect "${PLATFORM[@]}" "docker://${FULL_IMAGE}" 2>/dev/null || echo '{}')
          SIZE=$(echo "$INFO" | jq -r '[.LayersData[]?.Size // 0] | add // 0' 2>/dev/null || echo 0)

          MNT_FREE=$(df -m /mnt 2>/dev/null | awk 'NR==2 {print $4}' || echo 0)
          ROOT_FREE=$(df -m / | awk 'NR==2 {print $4}')
          if [ "$MNT_FREE" -gt "$ROOT_FREE" ]; then
            WORK_DIR="/mnt/docker_work"
            WORK_FREE="$MNT_FREE"
          else
            WORK_DIR="${RUNNER_TEMP:-/home/runner/work/_temp}/docker_work"
            WORK_FREE="$ROOT_FREE"
          fi

          EST_MB=$(( SIZE * 3 / 1024 / 1024 ))
          echo "压缩层总大小: $((SIZE / 1024 / 1024))MB | 预估峰值需求: ~${EST_MB}MB | 可用: ${WORK_FREE}MB"

          if [ $((WORK_FREE - EST_MB)) -lt 5120 ] || [ "$SIZE" -eq 0 ]; then
            echo "🧹 预计剩余安全空间不足 5GB（或无法预估体积），正在清理 Runner 预装软件..."
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                        /usr/local/share/powershell /usr/share/swift \
                        /opt/az /usr/share/miniconda
            sudo apt-get clean
            echo "清理后根分区可用: $(df -m / | awk 'NR==2 {print $4}')MB"
          fi

          sudo mkdir -p "$WORK_DIR" "$WORK_DIR/tmp"
          sudo chmod -R 777 "$WORK_DIR"
          {
            echo "WORK_DIR=$WORK_DIR"
            echo "TMPDIR=$WORK_DIR/tmp"
          } >> "$GITHUB_ENV"
          echo "📂 使用工作目录: $WORK_DIR"

      - name: 4. 拉取并压缩
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "$CALLBACK_URL" ]; then
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "$(jq -n --arg t "$TASK_ID" '{taskId:$t,stage:"pulling",stage_msg:"正在跨海拉取镜像…"}')" || echo "000")
            echo "回调 pulling: HTTP $CODE"
            [ "$CODE" = "200" ] || echo "::warning::阶段回调失败（HTTP $CODE）"
          fi

          PLATFORM=(--override-os "$ARCH_OS" --override-arch "$ARCH_NAME")
          [ -n "$ARCH_VARIANT" ] && PLATFORM+=(--override-variant "$ARCH_VARIANT")

          LOCAL_TAR="${WORK_DIR}/${TAR_NAME}"
          LOCAL_FILE="${LOCAL_TAR}.gz"

          copy_to_tar() {
            skopeo copy --tmpdir "$TMPDIR" "${PLATFORM[@]}" "docker://${FULL_IMAGE}" "docker-archive:${LOCAL_TAR}:${FULL_IMAGE}"
          }

          # 少数镜像的 OCI 清单里混用了 Docker 层 mediaType（application/vnd.docker.image.rootfs.diff.tar.gzip），
          # skopeo 转 docker-archive 时无法识别该组合，报
          # "Unknown media type during manifest conversion"，此时落盘 dir 布局、把清单归一化为 Docker schema2 再打包。
          if ! copy_to_tar; then
            echo "::warning::直接转 docker-archive 失败，改用 dir 布局归一化清单 mediaType 后重试"
            rm -f "$LOCAL_TAR"
            LAYOUT_DIR="${WORK_DIR}/dir_layout"
            rm -rf "$LAYOUT_DIR"
            skopeo copy --tmpdir "$TMPDIR" "${PLATFORM[@]}" "docker://${FULL_IMAGE}" "dir:${LAYOUT_DIR}"
            if jq -e '.layers' "${LAYOUT_DIR}/manifest.json" >/dev/null 2>&1; then
              jq '
                .mediaType = "application/vnd.docker.distribution.manifest.v2+json"
                | .config.mediaType = "application/vnd.docker.container.image.v1+json"
                | .layers |= map(.mediaType |= (
                    if . == "application/vnd.oci.image.layer.v1.tar+gzip" then "application/vnd.docker.image.rootfs.diff.tar.gzip"
                    elif . == "application/vnd.oci.image.layer.v1.tar" then "application/vnd.docker.image.rootfs.diff.tar"
                    elif . == "application/vnd.oci.image.layer.nondistributable.v1.tar+gzip" then "application/vnd.docker.image.rootfs.foreign.diff.tar.gzip"
                    elif . == "application/vnd.oci.image.layer.nondistributable.v1.tar" then "application/vnd.docker.image.rootfs.foreign.diff.tar"
                    else . end))
              ' "${LAYOUT_DIR}/manifest.json" > "${LAYOUT_DIR}/manifest.json.tmp"
              mv "${LAYOUT_DIR}/manifest.json.tmp" "${LAYOUT_DIR}/manifest.json"
            fi
            skopeo copy --tmpdir "$TMPDIR" "dir:${LAYOUT_DIR}" "docker-archive:${LOCAL_TAR}:${FULL_IMAGE}"
            rm -rf "$LAYOUT_DIR"
          fi
          rm -rf "${TMPDIR:?}"/*

          if [ -n "$CALLBACK_URL" ]; then
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "$(jq -n --arg t "$TASK_ID" '{taskId:$t,stage:"packing",stage_msg:"正在压缩打包镜像…"}')" || echo "000")
            echo "回调 packing: HTTP $CODE"
            [ "$CODE" = "200" ] || echo "::warning::阶段回调失败（HTTP $CODE）"
          fi

          pigz -6 -p 4 "$LOCAL_TAR"
          [ -f "$LOCAL_FILE" ] || { echo "::error::pigz 未生成 $LOCAL_FILE"; exit 1; }

          RAW_MANIFEST=$(skopeo inspect --raw "docker://${FULL_IMAGE}" 2>/dev/null || echo '{}')
          MEDIA_TYPE=$(echo "$RAW_MANIFEST" | jq -r '.mediaType // empty' 2>/dev/null || true)
          DIGEST=""
          if [ "$MEDIA_TYPE" = "application/vnd.docker.distribution.manifest.list.v2+json" ] || [ "$MEDIA_TYPE" = "application/vnd.oci.image.index.v1+json" ]; then
            DIGEST=$(echo "$RAW_MANIFEST" | jq -r \
              --arg os "$ARCH_OS" --arg arch "$ARCH_NAME" --arg variant "$ARCH_VARIANT" \
              '.manifests[] | select(.platform.os == $os) | select(.platform.architecture == $arch) | select($variant == "" or (.platform.variant // "") == $variant) | .digest' \
              2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            DIGEST=$(skopeo inspect "${PLATFORM[@]}" --format '{{.Digest}}' "docker://${FULL_IMAGE}" 2>/dev/null || echo "")
          fi
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::无法解析镜像 ${FULL_IMAGE} 在 ${ARCH} 下的 digest"
            exit 1
          fi

          SHA256_SUM=$(sha256sum "$LOCAL_FILE" | awk '{print $1}')
          MD5_SUM=$(md5sum "$LOCAL_FILE" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "$LOCAL_FILE")

          jq -n \
            --arg task_id "$TASK_ID" \
            --arg full_image "$FULL_IMAGE" \
            --arg source_name "$SOURCE" \
            --arg version "$VERSION" \
            --arg arch "${ARCH:-}" \
            --arg arch_os "$ARCH_OS" \
            --arg arch_name "$ARCH_NAME" \
            --arg arch_variant "$ARCH_VARIANT" \
            --arg file_name "$PAN_FILE_NAME" \
            --arg category_dir "$CATEGORY_DIR" \
            --argjson size "$SIZE_BYTES" \
            --arg sha256 "$SHA256_SUM" \
            --arg md5 "$MD5_SUM" \
            --arg docker_digest "$DIGEST" \
            '{task_id:$task_id, full_image:$full_image, source_name:$source_name,
              version:$version, arch:$arch, arch_os:$arch_os, arch_name:$arch_name,
              arch_variant:$arch_variant, file_name:$file_name, category_dir:$category_dir,
              file_size:$size, sha256:$sha256, md5:$md5, docker_digest:$docker_digest,
              packed_at:(now|floor)}' \
            > "${LOCAL_FILE}.meta.json"

          {
            echo "LOCAL_FILE=$LOCAL_FILE"
            echo "CHECKSUM_VALUE=$DIGEST"
            echo "SHA256_SUM=$SHA256_SUM"
            echo "MD5_SUM=$MD5_SUM"
            echo "SIZE_BYTES=$SIZE_BYTES"
          } >> "$GITHUB_ENV"
          echo "digest=$DIGEST sha256=$SHA256_SUM size=${SIZE_BYTES}B"

      # ============================================================
      # 步骤 5~6：R2 临时直链（前端可先下载）
      # ============================================================
      - name: 5. 上传至 Cloudflare R2
        if: steps.params.outputs.do_r2 == 'true'
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          [ -n "${R2_ACCOUNT_ID:-}" ] || { echo "::error::缺少 secret R2_ACCOUNT_ID"; exit 1; }
          [ -n "${R2_ACCESS_KEY_ID:-}" ] || { echo "::error::缺少 secret R2_ACCESS_KEY_ID"; exit 1; }
          [ -n "${R2_SECRET_ACCESS_KEY:-}" ] || { echo "::error::缺少 secret R2_SECRET_ACCESS_KEY"; exit 1; }

          BUCKET="${R2_BUCKET:-docker}"
          # R2 对象键：<registry别名>/<镜像名>/<文件>（网盘侧由 Agent 加 images/ 前缀）
          R2_KEY="${REGISTRY_ALIAS}/${IMAGE_DIR}/${PAN_FILE_NAME}"
          echo "R2_KEY=$R2_KEY" >> "$GITHUB_ENV"

          export RCLONE_CONFIG_R2_TYPE=s3
          export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
          export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export RCLONE_CONFIG_R2_REGION=auto
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"

          if [ -n "$CALLBACK_URL" ]; then
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "$(jq -n --arg t "$TASK_ID" '{taskId:$t,stage:"uploading_r2",stage_msg:"已打包完成，正在上传 R2…"}')" || echo "000")
            echo "回调 uploading_r2: HTTP $CODE"
            [ "$CODE" = "200" ] || echo "::warning::阶段回调失败（HTTP $CODE）"
          fi

          echo "📤 上传 → r2:${BUCKET}/${R2_KEY} (${SIZE_BYTES} bytes)"
          SUCCESS=0
          for i in 1 2 3 4 5; do
            echo "🔄 rclone attempt $i/5 ..."
            if rclone copyto "$LOCAL_FILE" "r2:${BUCKET}/${R2_KEY}" \
              --s3-no-check-bucket \
              --s3-chunk-size 64M --s3-upload-cutoff 64M --s3-upload-concurrency 4 \
              --transfers 1 --retries 3 --low-level-retries 10 --timeout 10m --progress; then
              SUCCESS=1
              break
            fi
            echo "⚠️  R2 上传中断 attempt $i"
            sleep 10
          done
          [ "$SUCCESS" -eq 1 ] || { echo "::error::R2 上传重试 5 次均失败"; exit 1; }

          REMOTE_BYTES=$(rclone lsjson --stat "r2:${BUCKET}/${R2_KEY}" 2>/dev/null | jq -r '.Size // empty' || true)
          if [ -z "$REMOTE_BYTES" ]; then
            REMOTE_BYTES=$(rclone lsl "r2:${BUCKET}/${R2_KEY}" 2>/dev/null | awk 'NR==1 {print $1}' || true)
          fi
          echo "远端大小: ${REMOTE_BYTES:-unknown} bytes / 本地: ${SIZE_BYTES} bytes"
          [ "$REMOTE_BYTES" = "$SIZE_BYTES" ] || { echo "::error::R2 对象大小与本地不一致"; exit 1; }

          echo "R2_UPLOAD_OK=1" >> "$GITHUB_ENV"
          echo "✅ R2 上传完成: $R2_KEY"

      - name: 6. 回调 R2 直链
        if: steps.params.outputs.do_r2 == 'true'
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${CALLBACK_URL:-}" ] || { echo "⚠️ 未配置 callback_url，跳过回调"; exit 0; }

          PAYLOAD=$(jq -n \
            --arg taskId "$TASK_ID" \
            --arg status "r2_ready" \
            --arg r2Key "${R2_KEY:-}" \
            --arg fileName "$PAN_FILE_NAME" \
            --argjson fileSize "${SIZE_BYTES:-0}" \
            --arg sha256 "${SHA256_SUM:-}" \
            --arg md5 "${MD5_SUM:-}" \
            --arg dockerDigest "${CHECKSUM_VALUE:-}" \
            '{taskId:$taskId, status:$status, r2Key:$r2Key, fileName:$fileName,
              fileSize:$fileSize, sha256:$sha256, md5:$md5, dockerDigest:$dockerDigest}')

          for i in 1 2 3; do
            RESP=$(curl -sS -w "\n%{http_code}" -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "$PAYLOAD" || true)
            CODE=$(printf '%s' "$RESP" | tail -n1)
            BODY=$(printf '%s' "$RESP" | sed '$d')
            echo "回调 r2_ready: HTTP $CODE"
            [ -n "$BODY" ] && echo "响应: $BODY"
            [ "$CODE" = "200" ] && { echo "R2_READY_OK=1" >> "$GITHUB_ENV"; exit 0; }
            echo "⚠️  回调失败（HTTP $CODE），重试 $i/3"
            sleep 5
          done
          echo "::error::R2 回调 3 次均失败"
          exit 1

      # ============================================================
      # 步骤 7：失败回传（兜底）
      # ============================================================
      - name: 7. 失败回传（兜底）
        if: failure()
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ "${ARCHIVE_SENT:-0}" = "1" ]; then
            echo "归档结果已回传，忽略后续失败"
            exit 0
          fi

          if [ "${R2_UPLOAD_OK:-0}" != "1" ] && [ -n "${R2_KEY:-}" ] && [ -n "${R2_ACCOUNT_ID:-}" ]; then
            export RCLONE_CONFIG_R2_TYPE=s3
            export RCLONE_CONFIG_R2_PROVIDER=Cloudflare
            export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            export RCLONE_CONFIG_R2_REGION=auto
            export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
            export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
            rclone deletefile "r2:${R2_BUCKET:-docker}/${R2_KEY}" 2>/dev/null || true
          fi

          [ -n "${CALLBACK_URL:-}" ] || exit 0
          RESULTS='[]'
          if [ -f /tmp/pan-results.json ] && jq -e . /tmp/pan-results.json >/dev/null 2>&1; then
            RESULTS=$(cat /tmp/pan-results.json)
          fi
          HINT="${FAIL_HINT:-后台任务失败：拉取/压缩/上传 R2 链路中断，请查看 Actions 日志}"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" \
            -d "$(jq -n --arg t "${TASK_ID:-manual}" --arg e "$HINT" --argjson results "$RESULTS" '{taskId:$t,status:"failed",error:$e,panResults:$results}')" || echo "000")
          echo "回调 failed: HTTP $CODE"
          [ "$CODE" = "200" ] || echo "::warning::失败回调未送达（HTTP $CODE）"

      - name: 8. 清理 Runner 临时文件
        if: always()
        shell: bash
        run: |
          [ -n "${LOCAL_FILE:-}" ] && rm -f "$LOCAL_FILE" "${LOCAL_FILE}.meta.json" || true
