name: Docker Image Overseas Sync Engine

on:
  repository_dispatch:
    types: [docker_sync, download_docker]
  workflow_dispatch:
    inputs:
      image_name:
        description: '镜像全名 (例如: redis:7-alpine 或 mariadb:10.11)'
        required: true
        default: 'mariadb:10.11'
      arch:
        description: '系统架构'
        required: true
        default: 'amd64'
        type: choice
        options:
          - amd64
          - arm64
      task_id:
        description: '任务追踪 ID'
        required: false
        default: ''
      callback_url:
        description: '回调通知接口'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 输入参数解析与命名规格化
        id: parse
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          RAW_IMAGE="${{ github.event.client_payload.image_name || github.event.inputs.image_name }}"
          ARCH="${{ github.event.client_payload.arch || github.event.inputs.arch || 'amd64' }}"
          TASK_ID="${{ github.event.client_payload.task_id || github.event.inputs.task_id }}"
          CALLBACK_URL="${{ github.event.client_payload.callback_url || github.event.inputs.callback_url }}"

          if [ -z "$RAW_IMAGE" ]; then exit 1; fi
          if [ -z "$TASK_ID" ]; then TASK_ID="manual_$(date +%s)"; fi

          RAW_IMAGE=$(echo "$RAW_IMAGE" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          CLEAN_NAME=$(echo "$RAW_IMAGE" | sed 's|^docker\.io/||' | sed 's|^library/||')

          if [[ "$CLEAN_NAME" == *"/"* ]]; then
              FIRST_PART="${CLEAN_NAME%%/*}"
              if [[ "$FIRST_PART" == *"."* ]]; then
                  CLEAN_NAME="${CLEAN_NAME#*/}"
              fi
          fi

          if [[ "$CLEAN_NAME" == *":"* ]]; then
              IMAGE_BASE="${CLEAN_NAME%%:*}"
              TAG="${CLEAN_NAME##*:}"
          else
              IMAGE_BASE="$CLEAN_NAME"
              TAG="latest"
          fi

          CLEAN_IMAGE_NAME=$(echo "$IMAGE_BASE" | tr '/' '-')
          CATEGORY_DIR="${IMAGE_BASE##*/}"

          SAFE_FILENAME="${CLEAN_IMAGE_NAME}_${TAG}_${ARCH}.tar"
          LOCAL_TAR="/tmp/${SAFE_FILENAME}"
          TARGET_DIR="alist_local:/docker_images/${CATEGORY_DIR}"

          if [[ "$RAW_IMAGE" != *"/"* ]]; then
            FULL_IMAGE="docker.io/library/${RAW_IMAGE}"
          elif [[ "$RAW_IMAGE" != *"."* ]] || [[ "${RAW_IMAGE%%/*}" != *"."* ]]; then
            FULL_IMAGE="docker.io/${RAW_IMAGE}"
          else
            FULL_IMAGE="${RAW_IMAGE}"
          fi

          echo "TASK_ID=$TASK_ID" >> $GITHUB_ENV
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE_BASE=$IMAGE_BASE" >> $GITHUB_ENV
          echo "SAFE_FILENAME=$SAFE_FILENAME" >> $GITHUB_ENV
          echo "CATEGORY_DIR=$CATEGORY_DIR" >> $GITHUB_ENV
          echo "LOCAL_TAR=$LOCAL_TAR" >> $GITHUB_ENV
          echo "CALLBACK_URL=$CALLBACK_URL" >> $GITHUB_ENV

          if [ -n "$CALLBACK_URL" ]; then
            curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"prepared\",\"message\":\"参数解析完成\"}" || true
          fi

      - name: 2. 安装必要运行工具链
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo curl jq pigz
          if [ -n "$CALLBACK_URL" ]; then
            curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"prepared\",\"message\":\"工具链就绪\"}" || true
          fi

      - name: 3. 智能预估镜像大小与按需清理磁盘
        run: |
          RAW_MANIFEST=$(skopeo inspect --raw "docker://${FULL_IMAGE}" || echo "{}")
          MEDIA_TYPE=$(echo "$RAW_MANIFEST" | jq -r '.mediaType // empty' 2>/dev/null || true)

          if [ "$MEDIA_TYPE" = "application/vnd.docker.distribution.manifest.list.v2+json" ] || [ "$MEDIA_TYPE" = "application/vnd.oci.image.index.v1+json" ]; then
              DIGEST=$(echo "$RAW_MANIFEST" | jq -r --arg arch "$ARCH" '.manifests[] | select(.platform.architecture == $arch) | .digest' 2>/dev/null | head -n 1)
              if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then
                  IMAGE_WITHOUT_TAG="${FULL_IMAGE%%:*}"
                  RAW_MANIFEST=$(skopeo inspect --raw "docker://${IMAGE_WITHOUT_TAG}@${DIGEST}" || echo "{}")
              fi
          fi

          COMPRESSED_SIZE=$(echo "$RAW_MANIFEST" | jq -r '[.layers[].size] | add // 0' 2>/dev/null || echo 0)
          ESTIMATED_MB=$(( COMPRESSED_SIZE * 3 / 1024 / 1024 ))
          FREE_SPACE_MB=$(df -m / | awk 'NR==2 {print $4}')

          if [ "$ESTIMATED_MB" -ge 10240 ] || [ $((FREE_SPACE_MB - ESTIMATED_MB)) -lt 5120 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune --all --force > /dev/null 2>&1 || true
            sudo apt-get clean
          fi

      - name: 4. 挂载 AList 临时容器 (增强容错捕获)
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          if [ -z "$QUARK_COOKIE" ]; then echo "❌ 缺少 QUARK_COOKIE Secret"; exit 1; fi
          docker run -d --name alist_sync -p 5244:5244 xhofe/alist:latest > /dev/null
          until curl -s http://127.0.0.1:5244/api/public/settings > /dev/null; do sleep 1; done
          docker exec alist_sync ./alist admin set 123456 > /dev/null

          TOKEN=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login -H "Content-Type: application/json" -d '{"username": "admin", "password": "123456"}' | jq -r '.data.token' 2>/dev/null)
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" == "null" ]; then
            echo "❌ AList 内部登录获取 Token 失败!"
            curl -sS -o /dev/null -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" -d "{\"taskId\":\"$TASK_ID\",\"status\":\"failed\",\"error\":\"AList 核心服务异常，获取凭证失败\"}" || true
            exit 1
          fi
          echo "ALIST_TOKEN=$TOKEN" >> $GITHUB_ENV

          MOUNT_RES=$(curl -s -X POST http://127.0.0.1:5244/api/admin/storage/create \
            -H "Authorization: $TOKEN" -H "Content-Type: application/json" \
            -d '{"mount_path": "/quark","order": 0,"remark": "temp_driver","driver": "Quark","addition": "{\"cookie\":\"'"$QUARK_COOKIE"'\",\"root_folder_id\":\"0\"}"}')
            
          MOUNT_CODE=$(echo "$MOUNT_RES" | jq -r '.code // 500' 2>/dev/null)
          if [ "$MOUNT_CODE" != "200" ]; then
             ERR_MSG=$(echo "$MOUNT_RES" | jq -r '.message // "未知"' 2>/dev/null)
             curl -sS -o /dev/null -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" -d "{\"taskId\":\"$TASK_ID\",\"status\":\"failed\",\"error\":\"夸克网盘挂载失败，Cookie可能已过期: $ERR_MSG\"}" || true
             exit 1
          fi

      - name: 5. 跨国满速拉取、压缩与上传 (异常穿透到前端)
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"pulling\",\"message\":\"拉取并压缩中，镜像较大时可能较久\"}" || true
          skopeo copy --override-os linux --override-arch "$ARCH" "docker://${FULL_IMAGE}" "docker-archive:${LOCAL_TAR}:${FULL_IMAGE}"

          pigz -9 -p 4 "$LOCAL_TAR"
          mv "${LOCAL_TAR}.gz" "$LOCAL_TAR"

          echo "📁 检测并创建夸克网盘目标文件夹..."
          MKDIR_RES=$(curl -s -X POST http://127.0.0.1:5244/api/fs/mkdir -H "Authorization: $ALIST_TOKEN" -H "Content-Type: application/json" -d '{"path": "/quark/docker_images/'"$CATEGORY_DIR"'"}')
          MKDIR_CODE=$(echo "$MKDIR_RES" | jq -r '.code // 500' 2>/dev/null || echo "500")
          if [ "$MKDIR_CODE" != "200" ]; then
             ERR_MSG=$(echo "$MKDIR_RES" | jq -r '.message // "未知错误"' 2>/dev/null)
             curl -sS -o /dev/null -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" -d "{\"taskId\":\"$TASK_ID\",\"status\":\"failed\",\"error\":\"夸克创建目录失败: $ERR_MSG\"}" || true
             exit 1
          fi

          if [ "$TAG" == "latest" ]; then
            curl -s -X POST http://127.0.0.1:5244/api/fs/remove -H "Authorization: $ALIST_TOKEN" -H "Content-Type: application/json" -d '{"dir": "/quark/docker_images/'"$CATEGORY_DIR"'", "names": ["'"$SAFE_FILENAME"'"]}' > /dev/null
          fi

          echo "📤 开始上传网盘..."
          curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"uploading\",\"message\":\"正在直传夸克网盘\"}" || true
          
          # 将 curl 输出内容保存，防止破坏脚本终端流
          curl -X PUT -# -H "Authorization: $ALIST_TOKEN" -H "File-Path: /quark/docker_images/${CATEGORY_DIR}/${SAFE_FILENAME}" -H "As-Task: false" -T "$LOCAL_TAR" "http://127.0.0.1:5244/api/fs/put" | tee upload_res.json
          
          UPLOAD_CODE=$(jq -r '.code // 500' upload_res.json 2>/dev/null || echo "500")
          if [ "$UPLOAD_CODE" != "200" ]; then
             ERR_MSG=$(jq -r '.message // "未知"' upload_res.json 2>/dev/null)
             curl -sS -o /dev/null -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" -d "{\"taskId\":\"$TASK_ID\",\"status\":\"failed\",\"error\":\"大文件上传夸克失败: $ERR_MSG\"}" || true
             exit 1
          fi

          rm -f "$LOCAL_TAR"

      - name: 6. 整理最终回调 (防 JSON 解析猝死版)
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          SHARE_URL=""
          SHARE_PWD=""
          SHARE_EXPIRE=""
          FAIL_REASON=""

          if [ "${{ job.status }}" == "success" ]; then
            SHARE_JSON=$(curl -s -X POST http://127.0.0.1:5244/api/fs/new_share \
              -H "Authorization: $ALIST_TOKEN" -H "Content-Type: application/json" \
              -d "{\"dirs\":[],\"files\":[\"/quark/docker_images/${CATEGORY_DIR}/${SAFE_FILENAME}\"],\"expires_in\":0}" || echo "{}")
            
            API_CODE=$(echo "$SHARE_JSON" | jq -r '.code // 500' 2>/dev/null || echo "500")
            if [ "$API_CODE" != "200" ]; then
               FAIL_REASON="生成网盘分享直链被拒绝: $(echo "$SHARE_JSON" | jq -r '.message // "未知错误"' 2>/dev/null)"
            else
               SHARE_CODE_RAW=$(echo "$SHARE_JSON" | jq -r '.data.urls.urls // .data.url // empty' 2>/dev/null || echo "")
               SHARE_PWD=$(echo "$SHARE_JSON" | jq -r '.data.password // empty' 2>/dev/null || echo "")
               if [ -n "$SHARE_CODE_RAW" ]; then
                 SHARE_URL="${ALIST_PUBLIC_BASE:-https://alist.example.com/s/}${SHARE_CODE_RAW}"
               fi
            fi
          fi

          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://$FULL_IMAGE" 2>/dev/null || echo "")"

          if [ -n "$CALLBACK_URL" ]; then
            PAYLOAD=$(jq -n \
              --arg taskId "$TASK_ID" \
              --arg status "$( [ -n "$SHARE_URL" ] && echo uploaded || echo failed )" \
              --arg error "$FAIL_REASON" \
              --arg imageBase "$IMAGE_BASE" \
              --arg imageName "$FULL_IMAGE" \
              --arg tag "$TAG" \
              --arg arch "$ARCH" \
              --arg shareUrl "$SHARE_URL" \
              --arg password "$SHARE_PWD" \
              --arg expireAt "$SHARE_EXPIRE" \
              --arg digest "$DIGEST" \
              '{
                taskId: $taskId,
                status: $status,
                error: (if $error != "" then $error else null end),
                imageBase: $imageBase,
                imageName: $imageName,
                tag: $tag,
                arch: $arch,
                fileName: $ENV.SAFE_FILENAME | if . then . else "" end,
                shareUrl: $shareUrl,
                password: $password,
                expireAt: $expireAt,
                digest: $digest
              }')

            PAYLOAD=$(echo "$PAYLOAD" | jq --arg fn "$SAFE_FILENAME" '.fileName = $fn')

            curl -sS -o /dev/null -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "$PAYLOAD" || true
          fi
