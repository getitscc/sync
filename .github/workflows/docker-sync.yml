name: Docker Image Overseas Sync Engine

on:
  repository_dispatch:
    types: [docker_sync, download_docker]
  workflow_dispatch:
    inputs:
      image_name:
        description: '镜像全名 (例如: redis:7-alpine 或 mariadb:10.11)'
        required: true
        default: 'mariadb:10.11'
      arch:
        description: '系统架构'
        required: true
        default: 'amd64'
        type: choice
        options:
          - amd64
          - arm64
      task_id:
        description: '任务追踪 ID (可选，留空自动生成)'
        required: false
        default: ''
      callback_url:
        description: '回调通知接口'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 输入参数解析与命名规格化 (彻底修复小数点解析Bug)
        id: parse
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          RAW_IMAGE="${{ github.event.client_payload.image_name || github.event.inputs.image_name }}"
          ARCH="${{ github.event.client_payload.arch || github.event.inputs.arch || 'amd64' }}"
          TASK_ID="${{ github.event.client_payload.task_id || github.event.inputs.task_id }}"
          CALLBACK_URL="${{ github.event.client_payload.callback_url || github.event.inputs.callback_url }}"

          if [ -z "$RAW_IMAGE" ]; then
            echo "❌ 错误: 未接收到目标镜像名称！"
            exit 1
          fi

          if [ -z "$TASK_ID" ]; then
            TASK_ID="manual_$(date +%s)"
          fi

          RAW_IMAGE=$(echo "$RAW_IMAGE" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          CLEAN_NAME=$(echo "$RAW_IMAGE" | sed 's|^docker\.io/||' | sed 's|^library/||')

          if [[ "$CLEAN_NAME" == *"/"* ]]; then
              FIRST_PART="${CLEAN_NAME%%/*}"
              if [[ "$FIRST_PART" == *"."* ]]; then
                  CLEAN_NAME="${CLEAN_NAME#*/}"
              fi
          fi

          if [[ "$CLEAN_NAME" == *":"* ]]; then
              IMAGE_BASE="${CLEAN_NAME%%:*}"
              TAG="${CLEAN_NAME##*:}"
          else
              IMAGE_BASE="$CLEAN_NAME"
              TAG="latest"
          fi

          CLEAN_IMAGE_NAME=$(echo "$IMAGE_BASE" | tr '/' '-')
          CATEGORY_DIR="${IMAGE_BASE##*/}"

          # 最终规范命名
          SAFE_FILENAME="${CLEAN_IMAGE_NAME}_${TAG}_${ARCH}.tar"
          LOCAL_TAR="/tmp/${SAFE_FILENAME}"
          TARGET_DIR="alist_local:/docker_images/${CATEGORY_DIR}"

          if [[ "$RAW_IMAGE" != *"/"* ]]; then
            FULL_IMAGE="docker.io/library/${RAW_IMAGE}"
          elif [[ "$RAW_IMAGE" != *"."* ]] || [[ "${RAW_IMAGE%%/*}" != *"."* ]]; then
            FULL_IMAGE="docker.io/${RAW_IMAGE}"
          else
            FULL_IMAGE="${RAW_IMAGE}"
          fi

          echo "TASK_ID=$TASK_ID" >> $GITHUB_ENV
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV
          echo "ARCH=$ARCH" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE_BASE=$IMAGE_BASE" >> $GITHUB_ENV
          echo "SAFE_FILENAME=$SAFE_FILENAME" >> $GITHUB_ENV
          echo "CATEGORY_DIR=$CATEGORY_DIR" >> $GITHUB_ENV
          echo "LOCAL_TAR=$LOCAL_TAR" >> $GITHUB_ENV
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV
          echo "CALLBACK_URL=$CALLBACK_URL" >> $GITHUB_ENV

          # 进度上报：prepared
          if [ -n "$CALLBACK_URL" ]; then
            curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"prepared\",\"message\":\"参数解析完成\"}" || true
          fi

          echo "=========================================================="
          echo "📋 任务 ID:       $TASK_ID"
          echo "🎯 目标拉取源:    $FULL_IMAGE"
          echo "🏷️  镜像版本:      $TAG"
          echo "💻 硬件架构:      $ARCH"
          echo "📁 网盘子目录:    /docker_images/${CATEGORY_DIR}/"
          echo "📦 归档文件名:    ${SAFE_FILENAME}"
          echo "=========================================================="

      - name: 2. 安装必要运行工具链 (移除 rclone，新增 pigz)
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo curl jq pigz
          if [ -n "$CALLBACK_URL" ]; then
            curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"prepared\",\"message\":\"工具链就绪\"}" || true
          fi

      - name: 3. 智能预估镜像大小与按需清理磁盘
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          echo "🔍 正在获取镜像 Manifest..."
          RAW_MANIFEST=$(skopeo inspect --raw "docker://${FULL_IMAGE}" || echo "{}")
          MEDIA_TYPE=$(echo "$RAW_MANIFEST" | jq -r '.mediaType // empty')

          if [ "$MEDIA_TYPE" = "application/vnd.docker.distribution.manifest.list.v2+json" ] || [ "$MEDIA_TYPE" = "application/vnd.oci.image.index.v1+json" ]; then
              DIGEST=$(echo "$RAW_MANIFEST" | jq -r --arg arch "$ARCH" '.manifests[] | select(.platform.architecture == $arch) | .digest' | head -n 1)
              if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then
                  IMAGE_WITHOUT_TAG="${FULL_IMAGE%%:*}"
                  RAW_MANIFEST=$(skopeo inspect --raw "docker://${IMAGE_WITHOUT_TAG}@${DIGEST}" || echo "{}")
              fi
          fi

          COMPRESSED_SIZE=$(echo "$RAW_MANIFEST" | jq -r '[.layers[].size] | add // 0')
          [ -z "$COMPRESSED_SIZE" ] || [ "$COMPRESSED_SIZE" == "null" ] && COMPRESSED_SIZE=0

          ESTIMATED_MB=$(( COMPRESSED_SIZE * 3 / 1024 / 1024 ))
          FREE_SPACE_MB=$(df -m / | awk 'NR==2 {print $4}')

          echo "📦 预估占用空间: ~${ESTIMATED_MB} MB | 💾 当前可用: ${FREE_SPACE_MB} MB"

          if [ "$ESTIMATED_MB" -ge 10240 ] || [ $((FREE_SPACE_MB - ESTIMATED_MB)) -lt 5120 ]; then
            echo "🧹 空间紧张，开始深度清理释放空间..."
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /usr/local/lib/node_modules /usr/local/share/vcpkg
            sudo docker image prune --all --force > /dev/null 2>&1 || true
            sudo apt-get clean
            echo "✅ 磁盘深度清理完毕！当前可用: $(df -h / | awk 'NR==2 {print $4}')"
          fi

      - name: 4. 挂载 AList 临时容器 (获取原生 API Token)
        env:
          QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          if [ -z "$QUARK_COOKIE" ]; then echo "❌ 缺少 QUARK_COOKIE Secret"; exit 1; fi
          docker run -d --name alist_sync -p 5244:5244 xhofe/alist:latest > /dev/null
          until curl -s http://127.0.0.1:5244/api/public/settings > /dev/null; do sleep 1; done
          docker exec alist_sync ./alist admin set 123456 > /dev/null

          # 获取全局 Token，存入环境变量供后续原生接口调用
          TOKEN=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login -H "Content-Type: application/json" -d '{"username": "admin", "password": "123456"}' | jq -r '.data.token')
          echo "ALIST_TOKEN=$TOKEN" >> $GITHUB_ENV

          curl -s -X POST http://127.0.0.1:5244/api/admin/storage/create \
            -H "Authorization: $TOKEN" -H "Content-Type: application/json" \
            -d '{"mount_path": "/quark","order": 0,"remark": "temp_driver","driver": "Quark","addition": "{\"cookie\":\"'"$QUARK_COOKIE"'\",\"root_folder_id\":\"0\"}"}' > /dev/null

          if [ -n "$CALLBACK_URL" ]; then
            curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"prepared\",\"message\":\"网盘驱动已挂载\"}" || true
          fi

      - name: 5. 跨国满速拉取、极速压缩与大文件直传
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          echo "📥 [Step 1/3] 海外拉取镜像并落盘..."
          # 进度：pulling
          curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CALLBACK_SECRET" \
            -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"pulling\",\"message\":\"拉取并压缩中，镜像较大时可能较久\"}" || true
          skopeo copy --override-os linux --override-arch "$ARCH" "docker://${FULL_IMAGE}" "docker-archive:${LOCAL_TAR}:${FULL_IMAGE}"

          echo "🗜️ [Step 2/3] 启动多核极速压缩 (大幅缩减体积以防夸克 405 报错，请耐心等待 1-2 分钟)..."
          # pigz 压缩后默认会生成 .tar.gz 并删除原文件
          pigz -9 -p 4 "$LOCAL_TAR"

          # docker load -i 兼容阅读伪装成 .tar 的 gzip 包，因此保留 .tar 扩展名
          mv "${LOCAL_TAR}.gz" "$LOCAL_TAR"

          FILE_SIZE=$(stat -c%s "$LOCAL_TAR")
          FILE_SIZE_MB=$(( FILE_SIZE / 1024 / 1024 ))
          echo "✅ 压缩完毕！最终转存体积大幅缩小至: ${FILE_SIZE_MB} MB"

          echo "📁 确保夸克网盘目标文件夹存在..."
          curl -s -X POST http://127.0.0.1:5244/api/fs/mkdir \
            -H "Authorization: $ALIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"path": "/quark/docker_images/'"$CATEGORY_DIR"'"}' > /dev/null

          if [ "$TAG" == "latest" ]; then
            echo "🗑️ [清理] 检测到 latest 版本，正在清理旧文件以便替换..."
            curl -s -X POST http://127.0.0.1:5244/api/fs/remove \
              -H "Authorization: $ALIST_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"dir": "/quark/docker_images/'"$CATEGORY_DIR"'", "names": ["'"$SAFE_FILENAME"'"]}' > /dev/null
          fi

          echo "📤 [Step 3/3] 调用原生 API 直传夸克 (下方将显示上传进度条)..."
          # 进度：uploading
          curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: $CALLBACK_SECRET" \
            -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"uploading\",\"message\":\"正在上传网盘\"}" || true
          curl -X PUT \
            -# \
            -H "Authorization: $ALIST_TOKEN" \
            -H "File-Path: /quark/docker_images/${CATEGORY_DIR}/${SAFE_FILENAME}" \
            -H "As-Task: false" \
            -T "$LOCAL_TAR" \
            "http://127.0.0.1:5244/api/fs/put"

          rm -f "$LOCAL_TAR"

      - name: 6. 生成分享链接并回传结果
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          JOB_STATUS="${{ job.status }}"
          echo "⌛ 等待上传完成状态: $JOB_STATUS"

          # ---- 进度：sharing ----
          if [ -n "$CALLBACK_URL" ]; then
            curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"sharing\",\"message\":\"正在生成分享链接\"}" || true
          fi

          # ---- 生成分享链接（AList / 夸克）----
          # 说明：临时容器内生成的分享链接仅在容器内可达；对外下载需用你“公网可访问的 AList/夸克”
          # 分享地址前缀 ALIST_PUBLIC_BASE 需按你的实际服务域名填写（可用 Workflow Variable 配置）
          SHARE_URL=""
          SHARE_PWD=""
          SHARE_EXPIRE=""
          if [ "$JOB_STATUS" == "success" ]; then
            SHARE_JSON=$(curl -s -X POST http://127.0.0.1:5244/api/fs/new_share \
              -H "Authorization: $ALIST_TOKEN" -H "Content-Type: application/json" \
              -d "{\"dirs\":[],\"files\":[\"/quark/docker_images/${CATEGORY_DIR}/${SAFE_FILENAME}\"],\"expires_in\":0}" || echo "{}")
            SHARE_CODE=$(echo "$SHARE_JSON" | jq -r '.data.urls.urls // .data.url // empty')
            SHARE_PWD=$(echo "$SHARE_JSON" | jq -r '.data.password // empty')
            # TODO: 字段名(如 data.urls) 依你的 AList 版本调整；公网前缀按需替换
            if [ -n "$SHARE_CODE" ]; then
              SHARE_URL="${ALIST_PUBLIC_BASE:-https://alist.example.com/s/}${SHARE_CODE}"
            fi
          fi

          # ---- 提取 digest ----
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://$FULL_IMAGE" 2>/dev/null || echo "")"

          echo "📢 回传分享结果: url=${SHARE_URL:-空} pwd=${SHARE_PWD:-空}"
          if [ -n "$CALLBACK_URL" ]; then
            PAYLOAD=$(jq -n \
              --arg taskId "$TASK_ID" \
              --arg status "$( [ "$JOB_STATUS" = "success" ] && [ -n "$SHARE_URL" ] && echo uploaded || echo failed )" \
              --arg imageBase "$IMAGE_BASE" \
              --arg imageName "$FULL_IMAGE" \
              --arg tag "$TAG" \
              --arg arch "$ARCH" \
              --arg shareUrl "$SHARE_URL" \
              --arg password "$SHARE_PWD" \
              --arg expireAt "$SHARE_EXPIRE" \
              --arg digest "$DIGEST" \
              '{
                taskId: $taskId,
                status: $status,
                imageBase: $imageBase,
                imageName: $imageName,
                tag: $tag,
                arch: $arch,
                fileName: $ENV.SAFE_FILENAME | if . then . else "" end,
                shareUrl: $shareUrl,
                password: $password,
                expireAt: $expireAt,
                digest: $digest
              }')
            # 补 fileName（上一个 jq 的 $ENV 取不到则手动回填）
            PAYLOAD=$(echo "$PAYLOAD" | jq --arg fn "$SAFE_FILENAME" '.fileName = $fn')

            curl -sS -o /dev/null -w "回调HTTP:%{http_code}\n" -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "$PAYLOAD" || echo "⚠️ 回调失败（前端将按超时处理）"
          fi
