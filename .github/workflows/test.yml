name: Docker Sync

# 由后端 repository_dispatch 触发（event_type=download_docker），也可手动运行。
# 本文件自包含：拉取 → 打包 → 领凭证 → 挂网盘 → 上传 → 回调，不依赖其它自定义 Action。
#
# 打包方式：skopeo copy → OCI 布局，官方索引（manifest list）
# 原样字节复制进 blobs、外层 index.json 指向它，输出未压缩 tar。
# 实测（nginx:trixie-perl linux/386）：用户 docker load 后 docker images --digests
# 的 DIGEST = 官方 index digest（sha256:a2a6bfbf…），与 Docker Hub 逐字一致。
# 双 digest 分工：checksumValue=平台 digest（服务端校验），indexDigest=官方索引
# digest（网页展示、供用户与官网比对），两口径不可混用。

on:
repository_dispatch:
types: [test]
workflow_dispatch:
inputs:
source_name:
description: '镜像名（可带 registry，如 ghcr.io/owner/repo）'
required: true
default: 'nginx'
version:
description: '版本 / tag（留空默认 latest）'
required: false
default: ''
arch:
description: '架构（linux/amd64、linux/arm/v7 或裸 amd64）'
required: false
default: 'linux/amd64'
profile_id:
description: '网盘账号 ID'
required: false
default: ''
task_id:
description: '任务 ID'
required: false
default: ''
callback_url:
description: '后端回调地址'
required: false
default: ''

jobs:
sync:
runs-on: ubuntu-latest
timeout-minutes: 90
steps:
- name: 1. 参数解析与镜像引用拼装
id: params
env:
CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET}}
IN_SOURCE: ${{ github.event.client_payload.source_name || github.event.inputs.source_name}}
IN_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version}}
IN_ARCH: ${{ github.event.client_payload.arch || github.event.inputs.arch || 'linux/amd64'}}
IN_PROFILE: ${{ github.event.client_payload.profile_id || github.event.inputs.profile_id}}
IN_TASK: ${{ github.event.client_payload.task_id || github.event.inputs.task_id}}
IN_CALLBACK: ${{ github.event.client_payload.callback_url || github.event.inputs.callback_url}}
run: |
set -euo pipefail
SOURCE="$IN_SOURCE"; VERSION="$IN_VERSION"; ARCH="$IN_ARCH"
[ -n "$SOURCE"] || { echo "::error::缺少 source_name"; exit 1;}
VERSION=$(printf '%s' "$VERSION" | tr -d '\r' | xargs || true)
SOURCE=$(printf '%s' "$SOURCE" | tr -d '\r' | xargs)

# 镜像名里可能自带:tag
if [ -z "$VERSION"] && [[ "$SOURCE" == *:*]]; then
VERSION="${SOURCE##*:}"; SOURCE="${SOURCE%%:*}"
fi
[ -n "$VERSION"] || VERSION="latest"

# 带 registry 前缀（首段含点）就用原样，否则补 docker.io
if [[ "$SOURCE" == *"/"*]] && [[ "${SOURCE%%/*}" == *.*]]; then
FULL_REPO="$SOURCE"
elif [[ "$SOURCE" == *"/"*]]; then
FULL_REPO="docker.io/$SOURCE"
else
FULL_REPO="docker.io/library/$SOURCE"
fi
FULL_IMAGE="${FULL_REPO}:${VERSION}"

# 架构拆 os/arch/variant（skopeo 要分开传）
if [[ "$ARCH" == *"/"*]]; then ARCH_OS="${ARCH%%/*}"; ARCH_REST="${ARCH#*/}"; else ARCH_OS="linux"; ARCH_REST="$ARCH"; fi
ARCH_NAME="${ARCH_REST%%/*}"; ARCH_VARIANT=""
[[ "$ARCH_REST" == */*]] && ARCH_VARIANT="${ARCH_REST#*/}"
ARCH_SAFE="${ARCH//\//-}"

CATEGORY_DIR="${SOURCE##*/}"
SAFE_NAME=$(printf '%s' "$SOURCE" | tr '/' '-')
PAN_FILE_NAME="${SAFE_NAME}_${VERSION}_${ARCH_SAFE}.tar"

# 本步骤内也要用到，所以先落成 shell 变量（写进 GITHUB_ENV 只对后续步骤生效）
TASK_ID="${IN_TASK:-manual_$(date +%s)}"
CALLBACK_URL="$IN_CALLBACK"
PROFILE_ID="${IN_PROFILE:-docker_quark}"

{
echo "SOURCE=$SOURCE"
echo "VERSION=$VERSION"
echo "ARCH=$ARCH"
echo "FULL_REPO=$FULL_REPO"
echo "FULL_IMAGE=$FULL_IMAGE"
echo "ARCH_OS=$ARCH_OS"
echo "ARCH_NAME=$ARCH_NAME"
echo "ARCH_VARIANT=$ARCH_VARIANT"
echo "CATEGORY_DIR=$CATEGORY_DIR"
echo "PAN_FILE_NAME=$PAN_FILE_NAME"
echo "PROFILE_ID=$PROFILE_ID"
echo "TASK_ID=$TASK_ID"
echo "CALLBACK_URL=$CALLBACK_URL"
} >> "$GITHUB_ENV"
echo "📋 $FULL_IMAGE | $ARCH"

# 阶段回调：已就绪（此时 jq 尚未安装，用字符串拼 JSON）
if [ -n "$CALLBACK_URL"]; then
curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
-H "Content-Type: application/json" \
-H "X-Callback-Secret: $CALLBACK_SECRET" \
-d "{\"taskId\":\"$TASK_ID\",\"stage\":\"prepared\",\"message\":\"参数解析完成，准备拉取\",\"projectType\":\"docker\"}" || true
fi

- name: 2. 安装工具链
run: |
sudo apt-get update -qq
sudo apt-get install -y -qq skopeo curl jq

- name: 3. 磁盘按需清理
run: |
set -euo pipefail
# 预估：OCI 打包全程约 2 倍镜像体积（布局 blobs + tar 各一份，层保持压缩形态）。
# 多架构镜像必须按「平台 manifest」的 layers 求和（对 index 直接求和恒为 0）；
# 预估失败（如 nvcr 需鉴权）时按 10GB 大镜像处理，先清理再说。
EST_MB=10240
RAW=$(skopeo inspect --raw "docker://${FULL_IMAGE}" 2>/dev/null || echo '{}')
MT=$(echo "$RAW" | jq -r '.mediaType // empty' 2>/dev/null || true)
SIZE=0
if [ "$MT" = "application/vnd.docker.distribution.manifest.list.v2+json"] || [ "$MT" = "application/vnd.oci.image.index.v1+json"]; then
PD=$(echo "$RAW" | jq -r \
--arg os "$ARCH_OS" --arg arch "$ARCH_NAME" --arg variant "$ARCH_VARIANT" '
def plat: (.platform // {});
def isatt: (plat.os // "") == "unknown" and (plat.architecture // "") == "unknown";
[.manifests[]? | select(isatt | not)
| select((plat.os // $os) == $os)
| select((plat.architecture // "") == $arch)
| select($variant == "" or (plat.variant // "") == $variant or (plat.variant == null))
][0].digest // empty' 2>/dev/null || true)
if [ -n "$PD"] && [ "$PD"!= "null"]; then
REPO=$(printf '%s' "$FULL_IMAGE" | sed 's/:[^:/]*$//')
PM=$(skopeo inspect --raw "docker://${REPO}@${PD}" 2>/dev/null || echo '{}')
SIZE=$(echo "$PM" | jq -r '[.layers[].size] | add // 0' 2>/dev/null || echo 0)
fi
else
SIZE=$(echo "$RAW" | jq -r '[.layers[].size] | add // 0' 2>/dev/null || echo 0)
fi
if [ -n "${SIZE:-}"] && [ "$SIZE"!= "null"] && [ "$SIZE" -gt 0]; then
EST_MB=$(( SIZE * 2 / 1024 / 1024))
fi
FREE_MB=$(df -m / | awk 'NR==2 {print $4}')
echo "预估占用: ~${EST_MB}MB | 可用: ${FREE_MB}MB"
if [ "$EST_MB" -ge 10240] || [ $((FREE_MB - EST_MB)) -lt 5120]; then
sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
/opt/hostedtoolcache/CodeQL /usr/local/share/boost \
/usr/local/share/powershell /usr/share/swift
sudo apt-get clean
fi

- name: 4. 拉取并打包（OCI 布局 + 官方索引原样入包，未压缩 tar）
env:
CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET}}
GHCR_TOKEN: ${{ secrets.GHCR_TOKEN}}
NGC_API_KEY: ${{ secrets.NGC_API_KEY}}
DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME}}
DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN}}
run: |
set -euo pipefail
# 阶段回调：开始拉取
if [ -n "$CALLBACK_URL"]; then
curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
-H "Content-Type: application/json" \
-H "X-Callback-Secret: $CALLBACK_SECRET" \
-d "{\"taskId\":\"$TASK_ID\",\"stage\":\"pulling\",\"message\":\"正在跨海拉取并打包镜像…\",\"projectType\":\"docker\"}" || true
fi

# 各 registry 的登录（都配了才登；公开镜像不需要）
if [[ "$FULL_IMAGE" == ghcr.io/*]] && [ -n "${GHCR_TOKEN:-}"]; then
echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "${{ github.actor}}" --password-stdin
fi
if [[ "$FULL_IMAGE" == nvcr.io/*]] && [ -n "${NGC_API_KEY:-}"]; then
echo "$NGC_API_KEY" | skopeo login nvcr.io -u '$oauthtoken' --password-stdin
fi
if [[ "$FULL_IMAGE" == docker.io/*]] && [ -n "${DOCKERHUB_TOKEN:-}"]; then
echo "$DOCKERHUB_TOKEN" | skopeo login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
fi

PLATFORM=(--override-os "$ARCH_OS" --override-arch "$ARCH_NAME")
[ -n "$ARCH_VARIANT"] && PLATFORM+=(--override-variant "$ARCH_VARIANT")

WORK="$(mktemp -d)"
LAYOUT="${WORK}/layout"

# 1) 官方索引原文 + index digest（与 inspect 的 {{.Digest}} 交叉校验）
skopeo inspect --raw "docker://${FULL_IMAGE}" > "${WORK}/index.raw"
IDX_DIGEST="sha256:$(sha256sum "${WORK}/index.raw" | awk '{print $1}')"
INSPECT_DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://${FULL_IMAGE}")"
if [ "${IDX_DIGEST}"!= "${INSPECT_DIGEST}"]; then
echo "::error::官方索引 digest 交叉校验不一致：${IDX_DIGEST} vs ${INSPECT_DIGEST}"
exit 1
fi

# 2) 平台 manifest digest：必须与服务端 platform_digest 算法完全一致，
# 否则回调时会被判「校验值不一致」。多架构下从索引里按平台条目挑
# （跳过 attestation 条目）；单架构直接用 manifest 自身 digest。
RAW_MANIFEST=$(cat "${WORK}/index.raw")
MEDIA_TYPE=$(echo "$RAW_MANIFEST" | jq -r '.mediaType // empty' 2>/dev/null || true)
DIGEST=""
if [ "$MEDIA_TYPE" = "application/vnd.docker.distribution.manifest.list.v2+json"] || [ "$MEDIA_TYPE" = "application/vnd.oci.image.index.v1+json"]; then
DIGEST=$(echo "$RAW_MANIFEST" | jq -r \
--arg os "$ARCH_OS" --arg arch "$ARCH_NAME" --arg variant "$ARCH_VARIANT" '
def plat: (.platform // {});
def isatt: (plat.os // "") == "unknown" and (plat.architecture // "") == "unknown";
[.manifests[]? | select(isatt | not)
| select((plat.os // $os) == $os)
| select((plat.architecture // "") == $arch)
| select($variant == "" or (plat.variant // "") == $variant or (plat.variant == null))
][0].digest // empty' 2>/dev/null || true)
fi
if [ -z "$DIGEST"] || [ "$DIGEST" = "null"]; then
DIGEST=$(skopeo inspect "${PLATFORM[@]}" --format '{{.Digest}}' "docker://${FULL_IMAGE}" 2>/dev/null || echo "")
fi
if [ -z "$DIGEST"] || [ "$DIGEST" = "null"]; then
echo "::error::无法解析镜像 ${FULL_IMAGE} 在 ${ARCH} 下的 digest"
exit 1
fi

# 3) skopeo 拉取为 OCI 布局（层 blob 保持 registry 原始字节）
skopeo copy "${PLATFORM[@]}" "docker://${FULL_IMAGE}" "oci:${LAYOUT}:${FULL_IMAGE}"

# 4) 官方索引原样复制进 blobs（一字节不动）；
# 平台 manifest 必须已被 skopeo 拉进布局，缺失即打包端出了问题。
cp "${WORK}/index.raw" "${LAYOUT}/blobs/sha256/${IDX_DIGEST#sha256:}"
if [! -f "${LAYOUT}/blobs/sha256/${DIGEST#sha256:}"]; then
echo "::error::OCI 布局内缺少平台 manifest blob ${DIGEST}"
exit 1
fi

# 5) 外层 index.json 指向官方索引：导入端据此建立 RepoDigests，
# docker images --digests 显示的即官方 index digest。
jq -n --arg dgst "${IDX_DIGEST}" --argjson size "$(stat -c%s "${WORK}/index.raw")" \
--arg mt "${MEDIA_TYPE}" --arg name "${FULL_IMAGE}" --arg ref "${VERSION}" \
'{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json",
manifests: [{mediaType: $mt, digest: $dgst, size: $size,
annotations: {"org.opencontainers.image.ref.name": $ref,
"io.containerd.image.name": $name}}]}' \
> "${LAYOUT}/index.json"
printf '{"imageLayoutVersion": "1.0.0"}' > "${LAYOUT}/oci-layout"

# 6) 未压缩 tar 输出（全程不做二次压缩/解压）
LOCAL_TAR="/tmp/${PAN_FILE_NAME}"
tar -C "${LAYOUT}" -cf "${LOCAL_TAR}" $(ls -A "${LAYOUT}")

SIZE_BYTES=$(stat -c%s "${LOCAL_TAR}")
{
echo "LOCAL_FILE=${LOCAL_TAR}"
echo "CHECKSUM_VALUE=${DIGEST}"
echo "IMAGE_INDEX_DIGEST=${IDX_DIGEST}"
echo "SIZE_BYTES=${SIZE_BYTES}"
} >> "$GITHUB_ENV"
echo "platformDigest=${DIGEST} indexDigest=${IDX_DIGEST} size=${SIZE_BYTES}B"
rm -rf "${WORK}"

- name: 4.5 包体自检（不通过即中止，坏包不上传）
shell: bash
run: |
set -euo pipefail
CHECK_DIR="$(mktemp -d)"
tar -C "${CHECK_DIR}" -xf "${LOCAL_FILE}"

[ -f "${CHECK_DIR}/oci-layout"] || { echo "::error::包内缺少 oci-layout"; exit 1;}
[ -f "${CHECK_DIR}/index.json"] || { echo "::error::包内缺少 index.json"; exit 1;}

# 外层索引必须指向官方索引，且官方索引 blob 的大小与 sha256 与声明一致
REF_DIGEST="$(jq -r '.manifests[0].digest' "${CHECK_DIR}/index.json")"
REF_SIZE="$(jq -r '.manifests[0].size' "${CHECK_DIR}/index.json")"
if [ "${REF_DIGEST}"!= "${IMAGE_INDEX_DIGEST}"]; then
echo "::error::index.json 指向 ${REF_DIGEST}，与官方索引 ${IMAGE_INDEX_DIGEST} 不符"; exit 1
fi
IDX_BLOB="${CHECK_DIR}/blobs/sha256/${REF_DIGEST#sha256:}"
[ -f "${IDX_BLOB}"] || { echo "::error::包内缺少官方索引 blob ${REF_DIGEST}"; exit 1;}
[ "$(stat -c%s "${IDX_BLOB}")" = "${REF_SIZE}"] || { echo "::error::索引 blob 大小与声明不符"; exit 1;}
[ "sha256:$(sha256sum "${IDX_BLOB}" | awk '{print $1}')" = "${REF_DIGEST}"] || {
echo "::error::索引 blob 内容摘要与声明不符"; exit 1;}

# 平台 manifest 在包内，且其引用的 config + 全部层 blob 齐全
MAN_BLOB="${CHECK_DIR}/blobs/sha256/${CHECKSUM_VALUE#sha256:}"
[ -f "${MAN_BLOB}"] || { echo "::error::包内缺少平台 manifest ${CHECKSUM_VALUE}"; exit 1;}
MISSING=""
for d in $(jq -r '.config.digest, (.layers[]?.digest)' "${MAN_BLOB}"); do
[ -f "${CHECK_DIR}/blobs/sha256/${d#sha256:}"] || MISSING="${MISSING} ${d}"
done
if [ -n "${MISSING}"]; then
echo "::error::平台 manifest 引用的 blob 不在包内：${MISSING}"; exit 1
fi
echo "包体自检通过：index=${IMAGE_INDEX_DIGEST} platform=${CHECKSUM_VALUE} size=$(stat -c%s "${LOCAL_FILE}")B"

# 布局可读性验证：skopeo 按「索引 → 平台 manifest」路径读一遍，读不通即中止。
# 注意：不用 runner 的 docker load 验收——其经典存储读不了 OCI 布局，
# 报错属环境差异；导入端行为已由 Digest Full Check 工作流实测证明。
PLAT_ARGS=(--override-os "$ARCH_OS" --override-arch "$ARCH_NAME")
if [ -n "$ARCH_VARIANT"]; then
PLAT_ARGS+=(--override-variant "$ARCH_VARIANT")
fi
skopeo inspect "${PLAT_ARGS[@]}" "oci:${CHECK_DIR}:${VERSION}" > /dev/null \
|| { echo "::error::OCI 布局不可读（索引到平台 manifest 解析失败）"; exit 1;}
echo "布局可读性验证通过"
rm -rf "${CHECK_DIR}"

- name: 5. 领取网盘凭证
shell: bash
env:
CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET}}
run: |
set -euo pipefail
CRED_URL="${CALLBACK_URL%/callback}/drive/credential?profile_id=${PROFILE_ID}"
CRED=$(curl -sS -f "$CRED_URL" -H "X-Callback-Secret: $CALLBACK_SECRET")
DRIVE_TYPE=$(echo "$CRED" | jq -r '.data.drive_type // empty')
COOKIE=$(echo "$CRED" | jq -r '.data.cookie // empty')
ROOT_FOLDER=$(echo "$CRED" | jq -r '.data.root_folder // empty')
ALIST_DRIVER=$(echo "$CRED" | jq -r '.data.alist_driver // empty')
if [ -z "$COOKIE"]; then
echo "::error::领取网盘凭证失败：$(echo "$CRED" | jq -r '.message // "响应为空"')"
exit 1
fi

# 网盘目标根目录：服务器下发的 root_folder 优先；为空则回落 /docker_images
if [ -z "$ROOT_FOLDER"]; then
ROOT_FOLDER="/docker_images"
fi
# 单行形式也遮一遍（多行 Cookie 的逐行遮罩由平台的 secret 机制兜底）
echo "::add-mask::$(printf '%s' "$COOKIE" | tr -d '\r\n')"
{
echo "DRIVE_TYPE=$DRIVE_TYPE"
echo "ROOT_FOLDER=$ROOT_FOLDER"
echo "ALIST_DRIVER=$ALIST_DRIVER"
echo "COOKIE<<__COOKIE_EOF__"
printf '%s\n' "$COOKIE"
echo "__COOKIE_EOF__"
} >> "$GITHUB_ENV"

- name: 6. 启动 AList 并挂载网盘
shell: bash
run: |
set -euo pipefail
docker run -d --name alist_sync -p 5244:5244 xhofe/alist:latest > /dev/null
for _ in $(seq 1 60); do
curl -s http://127.0.0.1:5244/api/public/settings > /dev/null && break
sleep 1
done
docker exec alist_sync./alist admin set 123456 > /dev/null
TOKEN=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login \
-H "Content-Type: application/json" \
-d '{"username":"admin","password":"123456"}' | jq -r '.data.token')
if [ -z "$TOKEN"] || [ "$TOKEN" = "null"]; then
echo "::error::AList 登录失败"
exit 1
fi
echo "ALIST_TOKEN=$TOKEN" >> "$GITHUB_ENV"

# 各网盘的 addition 结构不同，按 driver 组装（只传 cookie，其余字段交给驱动默认值）
case "$ALIST_DRIVER" in
Quark) ADDITION=$(jq -n --arg c "$COOKIE" '{cookie:$c, root_folder_id:"0"}');;
BaiduNetdisk) ADDITION=$(jq -n --arg c "$COOKIE" '{cookie:$c, root_folder:"/"}');;
*) ADDITION=$(jq -n --arg c "$COOKIE" '{cookie:$c}');;
esac

MOUNT=$(curl -s -X POST http://127.0.0.1:5244/api/admin/storage/create \
-H "Authorization: $TOKEN" -H "Content-Type: application/json" \
-d "$(jq -n --arg mp "/pan" --arg d "$ALIST_DRIVER" --arg a "$ADDITION" \
'{mount_path:$mp, order:0, remark:"temp", driver:$d, addition:$a}')")
CODE=$(echo "$MOUNT" | jq -r '.code // 500')
if [ "$CODE"!= "200"]; then
echo "::error::网盘挂载失败（$ALIST_DRIVER）：$(echo "$MOUNT" | jq -r '.message // "未知"')"
exit 1
fi

- name: 7. 上传并取文件 ID
shell: bash
env:
CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET}}
run: |
set -euo pipefail
DEST_DIR="/pan${ROOT_FOLDER}/${CATEGORY_DIR}"
curl -s -X POST http://127.0.0.1:5244/api/fs/mkdir \
-H "Authorization: $ALIST_TOKEN" -H "Content-Type: application/json" \
-d "$(jq -n --arg p "$DEST_DIR" '{path:$p}')" > /dev/null

# 移动标签（latest/stable/main）指向的内容会变：先删旧文件，避免同名冲突
case "$VERSION" in
latest|stable|main)
curl -s -X POST http://127.0.0.1:5244/api/fs/remove \
-H "Authorization: $ALIST_TOKEN" -H "Content-Type: application/json" \
-d "$(jq -n --arg d "$DEST_DIR" --arg n "$PAN_FILE_NAME" '{dir:$d, names:[$n]}')" > /dev/null
;;
esac

# 阶段回调：开始上传（含文件名与体积）
if [ -n "$CALLBACK_URL"]; then
curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
-H "Content-Type: application/json" \
-H "X-Callback-Secret: $CALLBACK_SECRET" \
-d "$(jq -n --arg t "$TASK_ID" --arg m \
"正在上传 $PAN_FILE_NAME（$((SIZE_BYTES/1024/1024)) MB）" \
'{taskId:$t, stage:"uploading", message:$m, projectType:"docker"}')" || true
fi

echo "📤 上传中：$PAN_FILE_NAME"
curl -sS -X PUT \
-H "Authorization: $ALIST_TOKEN" \
-H "File-Path: ${DEST_DIR}/${PAN_FILE_NAME}" \
-H "As-Task: false" \
-T "$LOCAL_FILE" \
"http://127.0.0.1:5244/api/fs/put" > upload_res.json
UPLOAD_CODE=$(jq -r '.code // 500' upload_res.json)
if [ "$UPLOAD_CODE"!= "200"]; then
echo "::error::上传失败：$(jq -r '.message // "未知"' upload_res.json)"
exit 1
fi

# 取文件 ID：翻页查找（每页 100 条、最多 20 页），避免文件多了之后
# 刚上传的文件不在第一页、FID 静默取空
FID=""
for page in $(seq 1 20); do
LIST=$(curl -s -X POST http://127.0.0.1:5244/api/fs/list \
-H "Authorization: $ALIST_TOKEN" -H "Content-Type: application/json" \
-d "$(jq -n --arg p "$DEST_DIR" --argjson page "$page" '{path:$p, page:$page, per_page:100}')")
HIT=$(echo "$LIST" | jq -r --arg fn "$PAN_FILE_NAME" \
'.data.content[]? | select(.name == $fn) | (.provider_id //.id //.fid //.raw.id) | select(.!= null)' | head -n 1)
if [ -n "$HIT"]; then FID="$HIT"; break; fi
CNT=$(echo "$LIST" | jq -r '.data.content | length' 2>/dev/null || echo 0)
[ "$CNT" -lt 100] && break
done
echo "🔑 文件 ID: ${FID:-（未取到）}"
{
echo "DRIVE_FID=$FID"
echo "PAN_PATH=${ROOT_FOLDER}/${CATEGORY_DIR}/${PAN_FILE_NAME}"
} >> "$GITHUB_ENV"

- name: 8. 回调后端（上传完成）
shell: bash
env:
CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET}}
run: |
set -euo pipefail
PAYLOAD=$(jq -n \
--arg taskId "$TASK_ID" \
--arg projectType "docker" \
--arg sourceName "$SOURCE" \
--arg version "$VERSION" \
--arg arch "${ARCH:-}" \
--arg checksumAlgo "docker-manifest-digest" \
--arg checksumValue "$CHECKSUM_VALUE" \
--arg indexDigest "${IMAGE_INDEX_DIGEST:-}" \
--arg packFormat "oci-tar" \
--argjson sizeBytes "${SIZE_BYTES:-0}" \
--arg driveFid "${DRIVE_FID:-}" \
--arg panPath "${PAN_PATH:-}" \
--arg panFileName "$PAN_FILE_NAME" \
--arg driveType "${DRIVE_TYPE:-}" \
'{taskId:$taskId, status:"uploaded", projectType:$projectType,
sourceName:$sourceName, version:$version, arch:$arch,
checksumAlgo:$checksumAlgo, checksumValue:$checksumValue,
indexDigest:$indexDigest,
packFormat:$packFormat, sizeBytes:$sizeBytes,
driveFid:$driveFid, panPath:$panPath, panFileName:$panFileName,
driveType:$driveType}')
curl -sS -o /dev/null -X POST "$CALLBACK_URL" \
-H "Content-Type: application/json" \
-H "X-Callback-Secret: $CALLBACK_SECRET" \
-d "$PAYLOAD" || true

- name: 9. 失败回传（兜底）
if: failure()
shell: bash
env:
CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET}}
run: |
[ -n "${CALLBACK_URL:-}"] || exit 0
HINT="${FAIL_HINT:-后台任务失败：Docker 镜像拉取/上传中断，请查看 Actions 日志}"
curl -sS -o /dev/null -X POST "$CALLBACK_URL" \
-H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" \
-d "$(jq -n --arg t "${TASK_ID:-manual}" --arg e "$HINT" '{taskId:$t,status:"failed",error:$e}')" || true
