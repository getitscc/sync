name: Test Image Digest Consistency (No Upload)

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: '测试镜像全名'
        required: true
        default: 'nginx:stable-alpine3.24-slim'
      arch:
        description: '系统架构'
        required: true
        default: 'amd64'
        type: choice
        options:
          - amd64
          - arm64

jobs:
  test-digest:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 安装测试工具 (skopeo / jq / pigz)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo jq pigz

      - name: 2. 下载打包、再导入并与官网核对 Manifest Digest
        run: |
          RAW_IMAGE="${{ github.event.inputs.image_name || 'nginx:stable-alpine3.24-slim' }}"
          ARCH="${{ github.event.inputs.arch || 'amd64' }}"
          FULL_IMAGE="docker.io/library/${RAW_IMAGE}"
          IMAGE_WITHOUT_TAG="${FULL_IMAGE%%:*}"

          echo "🔍 1. 获取官网 ${FULL_IMAGE} (linux/${ARCH}) 的真实 Digest..."
          RAW_MANIFEST=$(skopeo inspect --raw "docker://${FULL_IMAGE}")
          OFFICIAL_ARCH_DIGEST=$(echo "$RAW_MANIFEST" | jq -r --arg arch "$ARCH" '
            .manifests[] 
            | select(.platform.architecture == $arch and .platform.os == "linux" and (.annotations["vnd.docker.reference.type"] == null)) 
            | .digest' | head -n 1)

          ARCH_MANIFEST=$(skopeo inspect --raw "docker://${IMAGE_WITHOUT_TAG}@${OFFICIAL_ARCH_DIGEST}")
          OFFICIAL_IMAGE_ID=$(echo "$ARCH_MANIFEST" | jq -r '.config.digest')

          echo "=========================================================="
          echo "🌐 官网 linux/${ARCH} Manifest Digest : $OFFICIAL_ARCH_DIGEST"
          echo "🆔 官网 linux/${ARCH} Image ID        : $OFFICIAL_IMAGE_ID"
          echo "=========================================================="

          # ---------------- 测试 1: oci-archive 格式打包再导入 ----------------
          echo ""
          echo "🧪 [测试 1] 使用 oci-archive 格式打包并导入 containerd (保留完整 Manifest Digest)..."
          OCI_TAR="/tmp/test_oci.tar"
          skopeo copy --override-os linux --override-arch "$ARCH" \
            "docker://${IMAGE_WITHOUT_TAG}@${OFFICIAL_ARCH_DIGEST}" \
            "oci-archive:${OCI_TAR}:${RAW_IMAGE}"

          # 使用 pigz 压缩再解压，模拟真实上传下载过程
          pigz -9 -p 4 "$OCI_TAR"
          unpigz "${OCI_TAR}.gz"

          # 验证解压后的包内 Manifest Digest
          LOCAL_OCI_DIGEST=$(skopeo inspect "oci-archive:${OCI_TAR}" | jq -r '.Digest')
          # 直接导入到 GitHub Runner 的底层 containerd 引擎验证
          sudo ctr images import "$OCI_TAR" > /dev/null
          CTR_IMPORTED_DIGEST=$(sudo ctr images ls | grep "${RAW_IMAGE}" | awk '{print $3}' | head -n 1)

          echo "   -> 官网预期 Manifest Digest       : $OFFICIAL_ARCH_DIGEST"
          echo "   -> 归档包内实测 Manifest Digest   : $LOCAL_OCI_DIGEST"
          echo "   -> 导入引擎后实测 Manifest Digest : $CTR_IMPORTED_DIGEST"

          if [ "$OFFICIAL_ARCH_DIGEST" == "$LOCAL_OCI_DIGEST" ] && [ "$OFFICIAL_ARCH_DIGEST" == "$CTR_IMPORTED_DIGEST" ]; then
            echo "   ✅ 完美通过！导入后的 Manifest Digest 与官网 100% 一模一样！"
          else
            echo "   ❌ 测试失败：Digest 不一致！"
            exit 1
          fi

          # ---------------- 测试 2: docker-archive 格式打包再 docker load ----------------
          echo ""
          echo "🧪 [测试 2] 使用你原有的 docker-archive 格式打包并执行 docker load..."
          DOCKER_TAR="/tmp/test_docker.tar"
          skopeo copy --override-os linux --override-arch "$ARCH" \
            "docker://${IMAGE_WITHOUT_TAG}@${OFFICIAL_ARCH_DIGEST}" \
            "docker-archive:${DOCKER_TAR}:${RAW_IMAGE}"

          pigz -9 -p 4 "$DOCKER_TAR"
          mv "${DOCKER_TAR}.gz" "$DOCKER_TAR"

          docker load -i "$DOCKER_TAR"
          LOADED_IMAGE_ID=$(docker inspect --format='{{.Id}}' "$RAW_IMAGE")

          echo "   -> 官网预期 Image ID (Config)     : $OFFICIAL_IMAGE_ID"
          echo "   -> docker load 导入后实测 Image ID : $LOADED_IMAGE_ID"

          if [ "$OFFICIAL_IMAGE_ID" == "$LOADED_IMAGE_ID" ]; then
            echo "   ✅ 完美通过！docker load 导入后的 Image ID 与官网 100% 一模一样！"
          else
            echo "   ❌ 测试失败：Image ID 不一致！"
            exit 1
          fi
