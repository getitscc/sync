name: Docker Sync (Plan A — Overseas Pull + Domestic Worker Upload)

# =====================================================
# 方案 A 核心变化（对比原版）：
#   ❌ 不再在海外 Runner 启动 AList / 领 Cookie / 上传网盘
#   ✅ skopeo 拉取 + pigz 压缩 → rsync (SSH) 断点续推国内轻量云
#   ✅ 国内轻量云（常驻 AList + 多网盘账号）负责上传网盘、生成分享
#   ✅ 加 concurrency 防爆：同时最多 2 个大体积传输任务，保护国内 40GB 硬盘
#
# 需要在仓库 Secrets 里新增（原有 secrets 继续用）：
#   CN_SERVER_SSH_KEY   — 国内轻量云 SSH 私钥（ed25519）
#   CN_SERVER_HOST      — 国内轻量云公网 IP / 域名
#   CN_SERVER_PORT      — SSH 端口（默认 22）
#   CN_SERVER_USER      — SSH 用户
#   CN_SERVER_INCOMING  — 国内收件目录（默认 /data/jishi/incoming）
#   CN_WORKER_WEBHOOK   — 国内分发 Worker 的 webhook 地址
#   WEBHOOK_TOKEN       — 国内 Worker 验签 token
# =====================================================

on:
  repository_dispatch:
    types: [jishi_docker]
  workflow_dispatch:
    inputs:
      source_name:
        description: '镜像名（可带 registry，如 ghcr.io/owner/repo）'
        required: true
        default: 'nginx'
      version:
        description: '版本 / tag（留空默认 latest）'
        required: false
        default: ''
      arch:
        description: '架构（linux/amd64、linux/arm/v7 或裸 amd64）'
        required: false
        default: 'linux/amd64'
      profile_id:
        description: '（方案 A 中不再使用，保留兼容）网盘账号 ID'
        required: false
        default: ''
      task_id:
        description: '任务 ID'
        required: false
        default: ''
      callback_url:
        description: '后端回调地址'
        required: false
        default: ''

# 并发防爆：同一时间最多 2 个传输任务，保护国内轻量云 40GB 硬盘空间
# 说明：按 run_id 分组（每个 run 独占一个 slot），不会互相取消；
# 但一旦活跃 run 数超过 2，后续 run 会排队等待
concurrency:
  group: domestic-transfer-slot-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # ============================================================
      # 步骤 1~4：参数解析 + 拉取打包（和原版完全一致，保留成熟逻辑）
      # ============================================================

      - name: 1. 参数解析与镜像引用拼装
        id: params
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          IN_SOURCE: ${{ github.event.client_payload.source_name || github.event.inputs.source_name }}
          IN_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
          IN_ARCH: ${{ github.event.client_payload.arch || github.event.inputs.arch || 'linux/amd64' }}
          IN_PROFILE: ${{ github.event.client_payload.profile_id || github.event.inputs.profile_id }}
          IN_TASK: ${{ github.event.client_payload.task_id || github.event.inputs.task_id }}
          IN_CALLBACK: ${{ github.event.client_payload.callback_url || github.event.inputs.callback_url }}
        run: |
          set -euo pipefail
          SOURCE="$IN_SOURCE"; VERSION="$IN_VERSION"; ARCH="$IN_ARCH"
          [ -n "$SOURCE" ] || { echo "::error::缺少 source_name"; exit 1; }
          VERSION=$(printf '%s' "$VERSION" | tr -d '\r' | xargs || true)
          SOURCE=$(printf '%s' "$SOURCE" | tr -d '\r' | xargs)

          # 镜像名里可能自带 :tag
          if [ -z "$VERSION" ] && [[ "$SOURCE" == *:* ]]; then
            VERSION="${SOURCE##*:}"; SOURCE="${SOURCE%%:*}"
          fi
          [ -n "$VERSION" ] || VERSION="latest"

          # 带 registry 前缀（首段含点）就用原样，否则补 docker.io
          if [[ "$SOURCE" == *"/"* ]] && [[ "${SOURCE%%/*}" == *.* ]]; then
            FULL_REPO="$SOURCE"
          elif [[ "$SOURCE" == *"/"* ]]; then
            FULL_REPO="docker.io/$SOURCE"
          else
            FULL_REPO="docker.io/library/$SOURCE"
          fi
          FULL_IMAGE="${FULL_REPO}:${VERSION}"

          # 架构拆 os/arch/variant（skopeo 要分开传）
          if [[ "$ARCH" == *"/"* ]]; then ARCH_OS="${ARCH%%/*}"; ARCH_REST="${ARCH#*/}"; else ARCH_OS="linux"; ARCH_REST="$ARCH"; fi
          ARCH_NAME="${ARCH_REST%%/*}"; ARCH_VARIANT=""
          [[ "$ARCH_REST" == */* ]] && ARCH_VARIANT="${ARCH_REST#*/}"
          ARCH_SAFE="${ARCH//\//-}"

          CATEGORY_DIR="${SOURCE##*/}"
          SAFE_NAME=$(printf '%s' "$SOURCE" | tr '/' '-')
          PAN_FILE_NAME="${SAFE_NAME}_${VERSION}_${ARCH_SAFE}.tar"

          TASK_ID="${IN_TASK:-manual_$(date +%s)}"
          CALLBACK_URL="$IN_CALLBACK"

          {
            echo "SOURCE=$SOURCE"
            echo "VERSION=$VERSION"
            echo "ARCH=$ARCH"
            echo "FULL_IMAGE=$FULL_IMAGE"
            echo "ARCH_OS=$ARCH_OS"
            echo "ARCH_NAME=$ARCH_NAME"
            echo "ARCH_VARIANT=$ARCH_VARIANT"
            echo "CATEGORY_DIR=$CATEGORY_DIR"
            echo "PAN_FILE_NAME=$PAN_FILE_NAME"
            echo "TASK_ID=$TASK_ID"
            echo "CALLBACK_URL=$CALLBACK_URL"
          } >> "$GITHUB_ENV"
          echo "📋 $FULL_IMAGE | $ARCH"

          if [ -n "$CALLBACK_URL" ]; then
            curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"prepared\",\"message\":\"参数解析完成，准备拉取\",\"projectType\":\"docker\"}" || true
          fi

      - name: 2. 安装工具链（含 rsync）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo curl jq pigz rsync openssh-client

      - name: 3. 磁盘按需清理与工作目录准备
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 提前登录，确保私有或受限镜像也能正常 inspect 体积
          if [[ "$FULL_IMAGE" == ghcr.io/* ]] && [ -n "${GHCR_TOKEN:-}" ]; then
            echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi
          if [[ "$FULL_IMAGE" == nvcr.io/* ]] && [ -n "${NGC_API_KEY:-}" ]; then
            echo "$NGC_API_KEY" | skopeo login nvcr.io -u '$oauthtoken' --password-stdin
          fi
          if [[ "$FULL_IMAGE" == docker.io/* ]] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            echo "$DOCKERHUB_TOKEN" | skopeo login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin
          fi

          PLATFORM=(--override-os "$ARCH_OS" --override-arch "$ARCH_NAME")
          [ -n "$ARCH_VARIANT" ] && PLATFORM+=(--override-variant "$ARCH_VARIANT")

          INFO=$(skopeo inspect "${PLATFORM[@]}" "docker://${FULL_IMAGE}" 2>/dev/null || echo '{}')
          SIZE=$(echo "$INFO" | jq -r '[.LayersData[]?.Size // 0] | add // 0' 2>/dev/null || echo 0)

          # 选择可用空间最大的分区（对比 /mnt 与 /），规避 /tmp 的分区大小或 Quota 限制
          MNT_FREE=$(df -m /mnt 2>/dev/null | awk 'NR==2 {print $4}' || echo 0)
          ROOT_FREE=$(df -m / | awk 'NR==2 {print $4}')
          if [ "$MNT_FREE" -gt "$ROOT_FREE" ]; then
            WORK_DIR="/mnt/docker_work"
            WORK_FREE="$MNT_FREE"
          else
            WORK_DIR="${RUNNER_TEMP:-/home/runner/work/_temp}/docker_work"
            WORK_FREE="$ROOT_FREE"
          fi

          # 预估峰值占用：未压缩 tar + pigz 压缩过程双份占用
          EST_MB=$(( SIZE * 3 / 1024 / 1024 ))
          echo "压缩层总大小: $((SIZE / 1024 / 1024))MB | 预估峰值需求: ~${EST_MB}MB | 可用: ${WORK_FREE}MB"

          if [ $((WORK_FREE - EST_MB)) -lt 5120 ] || [ "$SIZE" -eq 0 ]; then
            echo "🧹 预计剩余安全空间不足 5GB（或无法预估体积），正在清理 Runner 预装软件..."
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                        /usr/local/share/powershell /usr/share/swift \
                        /opt/az /usr/share/miniconda
            sudo apt-get clean
            echo "清理后根分区可用: $(df -m / | awk 'NR==2 {print $4}')MB"
          fi

          sudo mkdir -p "$WORK_DIR" "$WORK_DIR/tmp"
          sudo chmod -R 777 "$WORK_DIR"
          {
            echo "WORK_DIR=$WORK_DIR"
            echo "TMPDIR=$WORK_DIR/tmp"
          } >> "$GITHUB_ENV"
          echo "📂 使用工作目录: $WORK_DIR"

      - name: 4. 拉取并压缩
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          # 阶段回调：开始拉取
          if [ -n "$CALLBACK_URL" ]; then
            curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"pulling\",\"message\":\"正在跨海拉取并压缩镜像…\",\"projectType\":\"docker\"}" || true
          fi

          PLATFORM=(--override-os "$ARCH_OS" --override-arch "$ARCH_NAME")
          [ -n "$ARCH_VARIANT" ] && PLATFORM+=(--override-variant "$ARCH_VARIANT")

          LOCAL_TAR="${WORK_DIR}/${PAN_FILE_NAME}"
          skopeo copy --tmpdir "$TMPDIR" "${PLATFORM[@]}" "docker://${FULL_IMAGE}" "docker-archive:${LOCAL_TAR}:${FULL_IMAGE}"

          # 立即清空 skopeo 临时缓存，为接下来的 pigz 压缩腾出最大磁盘空间
          rm -rf "${TMPDIR:?}"/*

          # pigz 压缩（方案 A 保留压缩，跨境传输量减少约 60%~80%，比裸 .tar 快得多）
          pigz -6 -p 4 "$LOCAL_TAR"
          mv "${LOCAL_TAR}.gz" "$LOCAL_TAR"

          # 平台 manifest digest（多架构镜像下取对应 os/arch/variant 的平台 digest）
          RAW_MANIFEST=$(skopeo inspect --raw "docker://${FULL_IMAGE}" 2>/dev/null || echo '{}')
          MEDIA_TYPE=$(echo "$RAW_MANIFEST" | jq -r '.mediaType // empty' 2>/dev/null || true)
          DIGEST=""
          if [ "$MEDIA_TYPE" = "application/vnd.docker.distribution.manifest.list.v2+json" ] || [ "$MEDIA_TYPE" = "application/vnd.oci.image.index.v1+json" ]; then
            DIGEST=$(echo "$RAW_MANIFEST" | jq -r \
              --arg os "$ARCH_OS" --arg arch "$ARCH_NAME" --arg variant "$ARCH_VARIANT" \
              '.manifests[] | select(.platform.os == $os) | select(.platform.architecture == $arch) | select($variant == "" or (.platform.variant // "") == $variant) | .digest' \
              2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            DIGEST=$(skopeo inspect "${PLATFORM[@]}" --format '{{.Digest}}' "docker://${FULL_IMAGE}" 2>/dev/null || echo "")
          fi
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::无法解析镜像 ${FULL_IMAGE} 在 ${ARCH} 下的 digest"
            exit 1
          fi

          # 额外算 SHA256 + MD5（供国内 Worker 网盘秒传哈希比对）
          SHA256_SUM=$(sha256sum "$LOCAL_TAR" | awk '{print $1}')
          MD5_SUM=$(md5sum "$LOCAL_TAR" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "$LOCAL_TAR")

          # 写入元数据描述文件（国内 Worker 读取）
          jq -n \
            --arg task_id "$TASK_ID" \
            --arg full_image "$FULL_IMAGE" \
            --arg source_name "$SOURCE" \
            --arg version "$VERSION" \
            --arg arch "${ARCH:-}" \
            --arg arch_os "$ARCH_OS" \
            --arg arch_name "$ARCH_NAME" \
            --arg arch_variant "$ARCH_VARIANT" \
            --arg file_name "$PAN_FILE_NAME" \
            --arg category_dir "$CATEGORY_DIR" \
            --argjson size "$SIZE_BYTES" \
            --arg sha256 "$SHA256_SUM" \
            --arg md5 "$MD5_SUM" \
            --arg docker_digest "$DIGEST" \
            '{task_id:$task_id, full_image:$full_image, source_name:$source_name,
              version:$version, arch:$arch, arch_os:$arch_os, arch_name:$arch_name,
              arch_variant:$arch_variant, file_name:$file_name, category_dir:$category_dir,
              file_size:$size, sha256:$sha256, md5:$md5, docker_digest:$docker_digest,
              packed_at:(now|floor)}' \
            > "${LOCAL_TAR}.meta.json"

          {
            echo "LOCAL_FILE=$LOCAL_TAR"
            echo "CHECKSUM_VALUE=$DIGEST"
            echo "SHA256_SUM=$SHA256_SUM"
            echo "MD5_SUM=$MD5_SUM"
            echo "SIZE_BYTES=$SIZE_BYTES"
          } >> "$GITHUB_ENV"
          echo "digest=$DIGEST sha256=$SHA256_SUM size=${SIZE_BYTES}B"

      # ============================================================
      # 步骤 5（新）：rsync 断点续推国内轻量云
      # ============================================================

      - name: 5. rsync 断点续推国内轻量云
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CN_SERVER_SSH_KEY }}
          CN_HOST: ${{ secrets.CN_SERVER_HOST }}
          CN_PORT: ${{ secrets.CN_SERVER_PORT }}
          CN_USER: ${{ secrets.CN_SERVER_USER }}
          CN_INCOMING: ${{ secrets.CN_SERVER_INCOMING }}
        run: |
          set -euo pipefail
          [ -n "${SSH_PRIVATE_KEY:-}" ] || { echo "::error::缺少 secret CN_SERVER_SSH_KEY"; exit 1; }
          [ -n "${CN_HOST:-}" ] || { echo "::error::缺少 secret CN_SERVER_HOST"; exit 1; }

          SSH_PORT="${CN_PORT:-22}"
          REMOTE_USER="${CN_USER:-root}"
          REMOTE_DIR="${CN_INCOMING:-/data/jishi/incoming}"

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 把 known_hosts 里也遮一下
          echo "::add-mask::${CN_HOST}"

          # 扫描 host key（不校验指纹，容器里一次性 SSH 安全）
          ssh-keyscan -p "$SSH_PORT" "$CN_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # 阶段回调：开始跨境传输
          if [ -n "$CALLBACK_URL" ]; then
            curl -sS -o /dev/null -f -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "{\"taskId\":\"$TASK_ID\",\"stage\":\"transferring\",\"message\":\"海外打包完成，正在跨境 rsync 推送国内服务器…\",\"projectType\":\"docker\"}" || true
          fi

          echo "📡 rsync 推送 → ${REMOTE_USER}@${CN_HOST}:${SSH_PORT}:${REMOTE_DIR}"
          echo "   文件: $PAN_FILE_NAME (${SIZE_BYTES} bytes)"

          # 国内服务器上创建收件目录（mkdir -p）
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "${REMOTE_USER}@${CN_HOST}" "mkdir -p '${REMOTE_DIR}'"

          # rsync：启用 --partial 支持断点续传，最多重试 5 次（跨境网络抖动常见）
          SUCCESS=0
          for i in 1 2 3 4 5; do
            echo "🔄 rsync attempt $i/5 ..."
            rsync -avz --partial --inplace --timeout=120 --progress \
              -e "ssh -i ~/.ssh/id_ed25519 -p ${SSH_PORT} -o StrictHostKeyChecking=no" \
              "$LOCAL_FILE" \
              "${LOCAL_FILE}.meta.json" \
              "${REMOTE_USER}@${CN_HOST}:${REMOTE_DIR}/" && SUCCESS=1 && break
            echo "⚠️  rsync interrupted on attempt $i"
            sleep 10
          done

          [ "$SUCCESS" -eq 1 ] || { echo "::error::rsync 重试 5 次均失败，跨境传输失败"; exit 1; }

          # 推送完成后立即删除 Runner 本地 .tar，释放磁盘（虽然 Runner 跑完会销毁，但早删更稳）
          rm -f "$LOCAL_FILE" "${LOCAL_FILE}.meta.json"

          echo "✅ 跨境传输完成"

      # ============================================================
      # 步骤 6（新）：通知国内分发 Worker 启动多网盘上传
      # ============================================================

      - name: 6. 通知国内分发 Worker + 回调后端
        env:
          CN_WORKER_WEBHOOK: ${{ secrets.CN_WORKER_WEBHOOK }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          set -euo pipefail

          # --- 6a. 通知国内 Worker ---
          if [ -n "${CN_WORKER_WEBHOOK:-}" ]; then
            echo "📤 通知国内分发 Worker: $CN_WORKER_WEBHOOK"
            # meta.json 已在步骤 4 生成到 Runner 磁盘，此处重新拼装（因为步骤 5 已删除原文件）
            DISPATCH_PAYLOAD=$(jq -n \
              --arg task_id "$TASK_ID" \
              --arg full_image "$FULL_IMAGE" \
              --arg source_name "$SOURCE" \
              --arg version "$VERSION" \
              --arg arch "${ARCH:-}" \
              --arg file_name "$PAN_FILE_NAME" \
              --arg category_dir "$CATEGORY_DIR" \
              --argjson size "${SIZE_BYTES:-0}" \
              --arg sha256 "${SHA256_SUM:-}" \
              --arg md5 "${MD5_SUM:-}" \
              --arg docker_digest "$CHECKSUM_VALUE" \
              '{task_id:$task_id, full_image:$full_image, source_name:$source_name,
                version:$version, arch:$arch, file_name:$file_name, category_dir:$category_dir,
                file_size:$size, sha256:$sha256, md5:$md5, docker_digest:$docker_digest,
                dispatched_from:"github_actions", dispatched_at:(now|floor)}')

            WEBHOOK_CODE=0
            if [ -n "${WEBHOOK_TOKEN:-}" ]; then
              curl -sS -f -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer ${WEBHOOK_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$DISPATCH_PAYLOAD" \
                "${CN_WORKER_WEBHOOK}/api/internal/dispatch" || WEBHOOK_CODE=$?
            else
              curl -sS -f -o /dev/null -w "%{http_code}" \
                -H "Content-Type: application/json" \
                -d "$DISPATCH_PAYLOAD" \
                "${CN_WORKER_WEBHOOK}/api/internal/dispatch" || WEBHOOK_CODE=$?
            fi
            echo "Webhook 响应: HTTP ${WEBHOOK_CODE}"
          else
            echo "⚠️  未配置 CN_WORKER_WEBHOOK，跳过 webhook 通知。国内 Worker 需自行轮询收件目录。"
          fi

          # --- 6b. 回调后端（状态: transferred_to_cn）---
          # 注意：方案 A 中 GitHub Actions 不再能拿到 drive_fid / pan_path，
          # 这些字段由国内 Worker 上传网盘后回传后端
          if [ -n "$CALLBACK_URL" ]; then
            CALLBACK_PAYLOAD=$(jq -n \
              --arg taskId "$TASK_ID" \
              --arg status "transferred_to_cn" \
              --arg projectType "docker" \
              --arg sourceName "$SOURCE" \
              --arg version "$VERSION" \
              --arg arch "${ARCH:-}" \
              --arg checksumAlgo "docker-manifest-digest" \
              --arg checksumValue "${CHECKSUM_VALUE:-}" \
              --arg packFormat "tar" \
              --argjson sizeBytes "${SIZE_BYTES:-0}" \
              '{taskId:$taskId, status:$status, projectType:$projectType,
                sourceName:$sourceName, version:$version, arch:$arch,
                checksumAlgo:$checksumAlgo, checksumValue:$checksumValue,
                packFormat:$packFormat, sizeBytes:$sizeBytes,
                message:"镜像已推送国内轻量云，等待国内 Worker 上传网盘"}')
            curl -sS -o /dev/null -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Callback-Secret: $CALLBACK_SECRET" \
              -d "$CALLBACK_PAYLOAD" || true
            echo "✅ 后端回调完成（状态: transferred_to_cn）"
          fi

      # ============================================================
      # 步骤 7（新）：失败回传（兜底）
      # ============================================================

      - name: 7. 失败回传（兜底）
        if: failure()
        shell: bash
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          [ -n "${CALLBACK_URL:-}" ] || exit 0
          HINT="${FAIL_HINT:-后台任务失败：Docker 镜像拉取/压缩/跨境传输中断，请查看 Actions 日志}"
          curl -sS -o /dev/null -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" \
            -d "$(jq -n --arg t "${TASK_ID:-manual}" --arg e "$HINT" '{taskId:$t,status:"failed",error:$e}')" || true
